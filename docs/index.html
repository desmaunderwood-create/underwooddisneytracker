    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [activePark, setActivePark] = useState('mk');
      const [activeMemberFilter, setActiveMemberFilter] = useState('ALL');
      const [rideState, setRideState] = useState({});
      const [foodState, setFoodState] = useState({});
      const [selectedRide, setSelectedRide] = useState(null);

      // Listen for updates from Firestore document: trackers/familyProgress
      useEffect(() => {
        if (!db) return;
        const docRef = db.collection('trackers').doc('familyProgress');
        const unsubscribe = docRef.onSnapshot((doc) => {
          if (doc.exists) {
            const data = doc.data();
            if (data.rideState) setRideState(data.rideState);
            if (data.foodState) setFoodState(data.foodState);
          }
        }, (error) => {
          console.error("Firestore Listen Error:", error);
        });
        return () => unsubscribe();
      }, []);

      // Toggle person ride check-off and write to Firestore
      const togglePerson = (rideId, memberId) => {
        const currentRiders = rideState[rideId] || [];
        const isRidden = currentRiders.includes(memberId);
        const updated = isRidden 
          ? currentRiders.filter(id => id !== memberId) 
          : [...currentRiders, memberId];
        
        const nextState = { ...rideState, [rideId]: updated };
        setRideState(nextState);

        if (db) {
          db.collection('trackers').doc('familyProgress')
            .set({ rideState: nextState }, { merge: true })
            .catch(err => console.error("Firestore Save Error:", err));
        }
      };

      // Toggle person food check-off and write to Firestore
      const toggleFood = (rideId, memberId) => {
        const currentEaters = foodState[rideId] || [];
        const isTried = currentEaters.includes(memberId);
        const updated = isTried
          ? currentEaters.filter(id => id !== memberId)
          : [...currentEaters, memberId];

        const nextFoodState = { ...foodState, [rideId]: updated };
        setFoodState(nextFoodState);

        if (db) {
          db.collection('trackers').doc('familyProgress')
            .set({ foodState: nextFoodState }, { merge: true })
            .catch(err => console.error("Firestore Food Save Error:", err));
        }
      };

      const filteredRides = RIDES_CATALOG.filter(r => {
        const matchesPark = activePark === 'ALL' || r.parkId === activePark;
        const matchesMember = activeMemberFilter === 'ALL' || 
          (rideState[r.id] || []).includes(activeMemberFilter) || 
          (foodState[r.id] || []).includes(activeMemberFilter);
        return matchesPark && matchesMember;
      });

      return (
        <div className="flex justify-center p-0 sm:p-4">
          <div className="w-full max-w-md bg-slate-900 min-h-screen sm:min-h-[850px] sm:rounded-3xl border border-slate-800 flex flex-col overflow-hidden shadow-2xl relative font-sans">
            
            {/* Main Header */}
            <header className="p-4 bg-gradient-to-b from-purple-950 via-slate-900 to-indigo-950 border-b border-amber-300/30 text-center">
              <div className="flex justify-center mb-2">
                <img 
                  src="https://github.com/desmaunderwood-create/underwooddisneytracker/blob/main/docs/logo2.png?raw=true" 
                  alt="Underwood Adventures Logo" 
                  className="h-12 object-contain"
                  onError={(e) => { e.target.style.display = 'none'; }}
                />
              </div>
              <div className="text-[10px] uppercase font-bold text-amber-300 tracking-widest">Happiness Rides Here ♡</div>
              <h1 className="text-xl font-bold font-serif text-amber-100 mt-1">Underwood Adventures</h1>
              
              {/* Family Member Avatars */}
              <div className="flex justify-around mt-4">
                <button 
                  onClick={() => setActiveMemberFilter('ALL')}
                  className={`flex flex-col items-center transition-all ${activeMemberFilter === 'ALL' ? 'scale-105 opacity-100' : 'opacity-60'}`}
                >
                  <div className={`w-10 h-10 rounded-full flex items-center justify-center font-bold text-xs bg-slate-800 text-amber-300 border-2 ${activeMemberFilter === 'ALL' ? 'border-amber-400 ring-2 ring-amber-400/40' : 'border-slate-700'}`}>
                    ALL
                  </div>
                  <span className="text-[9px] font-bold mt-1 text-slate-300">Everyone</span>
                </button>
                {FAMILY_MEMBERS.map(m => (
                  <button 
                    key={m.id} 
                    onClick={() => setActiveMemberFilter(prev => prev === m.id ? 'ALL' : m.id)}
                    className={`flex flex-col items-center transition-all ${activeMemberFilter === m.id ? 'scale-110 opacity-100' : 'opacity-60'}`}
                  >
                    <div className={`w-11 h-11 rounded-full p-0.5 border-2 ${activeMemberFilter === m.id ? 'border-amber-400 ring-2 ring-amber-400/40' : 'border-slate-700'}`}>
                      <img 
                        src={m.avatarImg} 
                        alt={m.name} 
                        className="w-full h-full rounded-full object-cover" 
                        onError={(e) => { e.target.src = 'https://placehold.co/100x100/1e293b/f59e0b?text=' + m.name; }}
                      />
                    </div>
                    <span className="text-[10px] font-bold mt-1 text-slate-200">{m.name}</span>
                  </button>
                ))}
              </div>
            </header>

            {/* Content Body */}
            <main className="flex-1 p-3 space-y-3 overflow-y-auto pb-20">
              
              {activeTab === 'home' && (
                <>
                  {/* Park Filters */}
                  <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
                    <button 
                      onClick={() => setActivePark('ALL')} 
                      className={`px-3 py-1.5 rounded-full text-xs font-bold transition-all ${activePark === 'ALL' ? 'bg-amber-400 text-slate-950' : 'bg-slate-800 text-slate-300'}`}
                    >
                      All Parks
                    </button>
                    {PARKS_CATALOG.map(p => (
                      <button 
                        key={p.id} 
                        onClick={() => setActivePark(p.id)} 
                        className={`px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all ${activePark === p.id ? 'bg-purple-600 text-white' : 'bg-slate-800 text-slate-300'}`}
                      >
                        {p.icon} {p.name}
                      </button>
                    ))}
                  </div>

                  {activeMemberFilter !== 'ALL' && (
                    <div className="bg-purple-950/60 border border-purple-500/30 rounded-xl p-2 flex justify-between items-center text-xs text-purple-200">
                      <span>Showing items for <strong>{FAMILY_MEMBERS.find(m => m.id === activeMemberFilter)?.name}</strong></span>
                      <button onClick={() => setActiveMemberFilter('ALL')} className="text-amber-300 font-bold underline text-[10px]">Clear Filter</button>
                    </div>
                  )}

                  {/* Ride & Pavilion List */}
                  <div className="space-y-2.5">
                    {filteredRides.map(ride => {
                      const riders = rideState[ride.id] || [];
                      const eaters = foodState[ride.id] || [];
                      return (
                        <div key={ride.id} className="bg-slate-800/80 hover:bg-slate-800 p-3 rounded-2xl border border-slate-700/80 transition-all">
                          <div className="flex space-x-3 cursor-pointer" onClick={() => setSelectedRide(ride)}>
                            <img 
                              src={ride.image} 
                              alt={ride.name} 
                              className="w-16 h-16 rounded-xl object-cover shrink-0" 
                              onError={(e) => { e.target.src = 'https://placehold.co/100x100/1e293b/f59e0b?text=Attraction'; }}
                            />
                            <div className="flex-1 min-w-0">
                              <h3 className="text-xs font-bold text-slate-100 flex items-center justify-between">
                                <span className="truncate">{ride.name}</span>
                                <span className="text-[10px] text-amber-400 font-semibold shrink-0 ml-1">Details ➔</span>
                              </h3>
                              <div className="text-[10px] text-amber-300 font-semibold">{ride.land} • {ride.duration}</div>
                              <p className="text-[10px] text-slate-400 line-clamp-1 mt-0.5">{ride.description}</p>
                            </div>
                          </div>

                          {/* Family Check-off Rows: Rides & Food */}
                          <div className="mt-2.5 pt-2 border-t border-slate-700/60 space-y-2">
                            {/* Who Rode / Visited */}
                            <div className="flex items-center justify-between">
                              <span className="text-[9px] font-bold text-slate-400 uppercase">Who Rode/Visited?</span>
                              <div className="flex space-x-2">
                                {FAMILY_MEMBERS.map(m => {
                                  const checked = riders.includes(m.id);
                                  return (
                                    <button
                                      key={m.id}
                                      onClick={(e) => {
                                        e.stopPropagation();
                                        togglePerson(ride.id, m.id);
                                      }}
                                      title={`Mark visited for ${m.name}`}
                                      className={`relative w-7 h-7 rounded-full overflow-hidden border-2 transition-all ${
                                        checked ? 'border-emerald-400 ring-2 ring-emerald-400/40 scale-105' : 'border-slate-600 opacity-40 hover:opacity-75'
                                      }`}
                                    >
                                      <img 
                                        src={m.avatarImg} 
                                        alt={m.name} 
                                        className="w-full h-full object-cover" 
                                        onError={(e) => { e.target.src = 'https://placehold.co/100x100/1e293b/f59e0b?text=' + m.name; }}
                                      />
                                      {checked && (
                                        <div className="absolute inset-0 bg-emerald-500/50 flex items-center justify-center font-bold text-white text-[10px]">
                                          ✓
                                        </div>
                                      )}
                                    </button>
                                  );
                                })}
                              </div>
                            </div>

                            {/* Who Tried Food */}
                            <div className="flex items-center justify-between">
                              <span className="text-[9px] font-bold text-amber-300 uppercase flex items-center gap-0.5">
                                🍴 Tried Food?
                              </span>
                              <div className="flex space-x-2">
                                {FAMILY_MEMBERS.map(m => {
                                  const foodChecked = eaters.includes(m.id);
                                  return (
                                    <button
                                      key={m.id}
                                      onClick={(e) => {
                                        e.stopPropagation();
                                        toggleFood(ride.id, m.id);
                                      }}
                                      title={`Mark food tried for ${m.name}`}
                                      className={`relative w-7 h-7 rounded-full overflow-hidden border-2 transition-all ${
                                        foodChecked ? 'border-amber-400 ring-2 ring-amber-400/40 scale-105' : 'border-slate-600 opacity-40 hover:opacity-75'
                                      }`}
                                    >
                                      <img 
                                        src={m.avatarImg} 
                                        alt={m.name} 
                                        className="w-full h-full object-cover" 
                                        onError={(e) => { e.target.src = 'https://placehold.co/100x100/1e293b/f59e0b?text=' + m.name; }}
                                      />
                                      {foodChecked && (
                                        <div className="absolute inset-0 bg-amber-500/60 flex items-center justify-center font-bold text-white text-[9px]">
                                          🍴
                                        </div>
                                      )}
                                    </button>
                                  );
                                })}
                              </div>
                            </div>
                          </div>

                        </div>
                      );
                    })}
                  </div>
                </>
              )}

              {activeTab === 'stats' && (
                <div className="space-y-4">
                  <h2 className="text-sm font-bold text-slate-100 uppercase tracking-wide">Family Leaderboard</h2>
                  
                  {/* Rides Progress */}
                  <div className="bg-slate-800/90 p-4 rounded-2xl border border-slate-700 space-y-4">
                    <h3 className="text-xs font-bold text-amber-300 uppercase">🏰 Rides & Pavilions Visited</h3>
                    {FAMILY_MEMBERS.map(m => {
                      const count = Object.values(rideState).filter(r => r.includes(m.id)).length;
                      const pct = Math.round((count / RIDES_CATALOG.length) * 100);
                      return (
                        <div key={m.id} className="space-y-1.5">
                          <div className="flex items-center justify-between text-xs">
                            <div className="flex items-center space-x-2">
                              <img src={m.avatarImg} alt={m.name} className="w-6 h-6 rounded-full object-cover border border-amber-300" onError={(e) => { e.target.src = 'https://placehold.co/100x100/1e293b/f59e0b?text=' + m.name; }} />
                              <span className="font-bold text-slate-200">{m.name}</span>
                            </div>
                            <span className="font-bold text-amber-300">{count} / {RIDES_CATALOG.length} ({pct}%)</span>
                          </div>
                          <div className="w-full bg-slate-900 h-2.5 rounded-full overflow-hidden p-0.5 border border-slate-800">
                            <div className={`h-full rounded-full bg-gradient-to-r ${m.barColor} transition-all duration-500`} style={{ width: `${pct}%` }}></div>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {/* Food Tracker Leaderboard */}
                  <div className="bg-slate-800/90 p-4 rounded-2xl border border-slate-700 space-y-4">
                    <h3 className="text-xs font-bold text-amber-300 uppercase">🍴 World Showcase Foodies</h3>
                    {FAMILY_MEMBERS.map(m => {
                      const count = Object.values(foodState).filter(r => r.includes(m.id)).length;
                      const totalCountries = RIDES_CATALOG.filter(r => r.land.includes('World Showcase')).length;
                      const pct = Math.round((count / (totalCountries || 1)) * 100);
                      return (
                        <div key={m.id} className="space-y-1.5">
                          <div className="flex items-center justify-between text-xs">
                            <div className="flex items-center space-x-2">
                              <img src={m.avatarImg} alt={m.name} className="w-6 h-6 rounded-full object-cover border border-amber-300" onError={(e) => { e.target.src = 'https://placehold.co/100x100/1e293b/f59e0b?text=' + m.name; }} />
                              <span className="font-bold text-slate-200">{m.name}</span>
                            </div>
                            <span className="font-bold text-amber-300">{count} / {totalCountries} locations tried</span>
                          </div>
                          <div className="w-full bg-slate-900 h-2.5 rounded-full overflow-hidden p-0.5 border border-slate-800">
                            <div className={`h-full rounded-full bg-gradient-to-r ${m.barColor} transition-all duration-500`} style={{ width: `${Math.min(pct, 100)}%` }}></div>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                </div>
              )}

            </main>

            {/* Detailed Card View Modal */}
            {selectedRide && (
              <div className="absolute inset-0 z-50 bg-[#faf6ed] text-slate-900 flex flex-col overflow-y-auto">
                {/* Header Image with Back & Heart Buttons */}
                <div className="relative h-64 w-full shrink-0">
                  <img src={selectedRide.image} alt={selectedRide.name} className="w-full h-full object-cover" />
                  <button 
                    onClick={() => setSelectedRide(null)}
                    className="absolute top-4 left-4 w-9 h-9 bg-white/90 rounded-full flex items-center justify-center font-bold shadow text-slate-800 active:scale-95"
                  >
                    ❮
                  </button>
                  <button className="absolute top-4 right-4 w-9 h-9 bg-white/90 rounded-full flex items-center justify-center shadow text-pink-600 font-bold active:scale-95">
                    ♥
                  </button>
                </div>

                {/* Card Detail Content */}
                <div className="flex-1 p-5 -mt-6 bg-[#faf6ed] rounded-t-3xl flex flex-col justify-between">
                  <div className="space-y-4">
                    <div>
                      <h2 className="text-2xl font-bold text-[#1b2240] leading-tight font-serif">{selectedRide.name}</h2>
                      <span className="inline-flex items-center space-x-1 mt-2.5 px-3 py-1 bg-[#f4e6d4] text-[#8c5e31] rounded-full text-xs font-semibold">
                        <span>🏰</span>
                        <span>{selectedRide.land}</span>
                      </span>
                    </div>

                    <p className="text-xs text-slate-600 leading-relaxed font-medium">
                      {selectedRide.description}
                    </p>

                    <div className="space-y-3.5 pt-2 text-xs">
                      {/* Thrill Level */}
                      <div className="flex items-center space-x-3.5">
                        <div className="w-6 text-center text-[#1b2240] text-lg font-bold">🎢</div>
                        <div>
                          <div className="font-semibold text-slate-500 text-[10px]">Thrill Level</div>
                          <div className="flex space-x-1 mt-0.5">
                            {[1, 2, 3, 4, 5].map((star) => (
                              <span key={star} className={star <= selectedRide.thrillLevel ? "text-[#1b2240] text-sm" : "text-slate-300 text-sm"}>
                                🐭
                              </span>
                            ))}
                          </div>
                        </div>
                      </div>

                      {/* Height Requirement */}
                      <div className="flex items-center space-x-3.5">
                        <div className="w-6 text-center text-[#1b2240] text-lg font-bold">🧍</div>
                        <div>
                          <div className="font-semibold text-slate-500 text-[10px]">Height Requirement</div>
                          <div className="font-bold text-[#1b2240] text-xs">{selectedRide.heightRequirement}</div>
                        </div>
                      </div>

                      {/* Ride / Attraction Type */}
                      <div className="flex items-center space-x-3.5">
                        <div className="w-6 text-center text-[#1b2240] text-lg font-bold">🎟️</div>
                        <div>
                          <div className="font-semibold text-slate-500 text-[10px]">Attraction Type</div>
                          <div className="font-bold text-[#1b2240] text-xs">{selectedRide.rideType}</div>
                        </div>
                      </div>

                      {/* Duration */}
                      <div className="flex items-center space-x-3.5">
                        <div className="w-6 text-center text-[#1b2240] text-lg font-bold">⏱️</div>
                        <div>
                          <div className="font-semibold text-slate-500 text-[10px]">Duration</div>
                          <div className="font-bold text-[#1b2240] text-xs">{selectedRide.duration}</div>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Toggle Per-Person Buttons inside Detail Modal */}
                  <div className="pt-6 pb-2 space-y-4">
                    {/* Ride/Visit Checkboxes */}
                    <div className="space-y-2">
                      <div className="text-xs font-bold text-slate-700 uppercase tracking-wide">Who Visited / Rode?</div>
                      <div className="grid grid-cols-2 gap-2">
                        {FAMILY_MEMBERS.map(m => {
                          const checked = (rideState[selectedRide.id] || []).includes(m.id);
                          return (
                            <button
                              key={m.id}
                              onClick={() => togglePerson(selectedRide.id, m.id)}
                              className={`flex items-center space-x-2 p-2 rounded-xl border transition-all text-xs font-bold ${
                                checked ? 'bg-emerald-100 border-emerald-500 text-emerald-900' : 'bg-slate-100 border-slate-300 text-slate-600'
                              }`}
                            >
                              <img src={m.avatarImg} alt={m.name} className="w-6 h-6 rounded-full object-cover" />
                              <span>{m.name}</span>
                              <span className="ml-auto font-black">{checked ? '✓' : '+'}</span>
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    {/* Food Checkboxes */}
                    <div className="space-y-2">
                      <div className="text-xs font-bold text-amber-800 uppercase tracking-wide flex items-center gap-1">
                        🍴 Who Tried Food Here?
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        {FAMILY_MEMBERS.map(m => {
                          const foodChecked = (foodState[selectedRide.id] || []).includes(m.id);
                          return (
                            <button
                              key={m.id}
                              onClick={() => toggleFood(selectedRide.id, m.id)}
                              className={`flex items-center space-x-2 p-2 rounded-xl border transition-all text-xs font-bold ${
                                foodChecked ? 'bg-amber-100 border-amber-500 text-amber-900' : 'bg-slate-100 border-slate-300 text-slate-600'
                              }`}
                            >
                              <img src={m.avatarImg} alt={m.name} className="w-6 h-6 rounded-full object-cover" />
                              <span>{m.name}</span>
                              <span className="ml-auto font-black">{foodChecked ? '🍴' : '+'}</span>
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    <button 
                      onClick={() => setSelectedRide(null)}
                      className="w-full mt-2 py-3 bg-[#ffc844] hover:bg-[#f5bc33] text-slate-950 rounded-2xl font-bold text-xs shadow-md"
                    >
                      Done / Back to List
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Bottom Navigation */}
            <nav className="h-14 bg-slate-950 border-t border-slate-800 flex justify-around items-center shrink-0">
              <button onClick={() => setActiveTab('home')} className={`text-xs font-bold ${activeTab === 'home' ? 'text-amber-400' : 'text-slate-400'}`}>
                🏰 Rides & Pavilions
              </button>
              <button onClick={() => setActiveTab('stats')} className={`text-xs font-bold ${activeTab === 'stats' ? 'text-amber-400' : 'text-slate-400'}`}>
                📊 Leaderboard
              </button>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
