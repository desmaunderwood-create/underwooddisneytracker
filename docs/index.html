    // Helper to normalize ride names to match ThemeParks.wiki live data automatically
    const normalizeName = (str) =>
      str.toLowerCase()
        .replace(/^(star wars:|avatar|the twilight zone|walt disney's)\s*/g, '')
        .replace(/[^a-z0-9]/g, '');

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [activePark, setActivePark] = useState('mk');
      const [activeMemberFilter, setActiveMemberFilter] = useState('ALL');
      const [rideState, setRideState] = useState({});
      const [characterState, setCharacterState] = useState({});
      const [foodState, setFoodState] = useState({});
      const [selectedRide, setSelectedRide] = useState(null);

      // Live Wait Times from ThemeParks.wiki
      const [liveWaitTimes, setLiveWaitTimes] = useState({});
      const [lastWaitUpdate, setLastWaitUpdate] = useState(null);

      // Individual Pass Tracker State (per family member)
      const [selectedPassMember, setSelectedPassMember] = useState('mom');
      const [passDataByMember, setPassDataByMember] = useState({
        mom: { price: '', visits: [] },
        dad: { price: '', visits: [] },
        emma: { price: '', visits: [] },
        harper: { price: '', visits: [] }
      });
      const [selectedPassPark, setSelectedPassPark] = useState('Magic Kingdom');
      const [visitDate, setVisitDate] = useState(() => new Date().toISOString().split('T')[0]);

      // Fetch Live Wait Times for all 4 WDW Parks from ThemeParks.wiki
      useEffect(() => {
        let isMounted = true;

        async function fetchAllWaitTimes() {
          try {
            const results = await Promise.all(
              PARKS_CATALOG.map(p =>
                fetch(`https://api.themeparks.wiki/v1/entity/${p.wikiId}/live`)
                  .then(res => res.ok ? res.json() : null)
                  .catch(() => null)
              )
            );

            const waitMap = {};
            results.forEach(parkData => {
              if (parkData && Array.isArray(parkData.liveData)) {
                parkData.liveData.forEach(entity => {
                  if (entity.entityType === 'ATTRACTION' && entity.name) {
                    const key = normalizeName(entity.name);
                    waitMap[key] = {
                      status: entity.status || 'UNKNOWN',
                      waitTime: entity.queue?.STANDBY?.waitTime ?? null,
                      returnTime: entity.queue?.RETURN_TIME?.state ?? null
                    };
                  }
                });
              }
            });

            if (isMounted && Object.keys(waitMap).length > 0) {
              setLiveWaitTimes(waitMap);
              setLastWaitUpdate(new Date());
            }
          } catch (err) {
            console.error("ThemeParks.wiki Fetch Error:", err);
          }
        }

        fetchAllWaitTimes();
        const interval = setInterval(fetchAllWaitTimes, 60000);
        return () => {
          isMounted = false;
          clearInterval(interval);
        };
      }, []);

      // Helper to look up live wait info for a ride
      const getLiveInfoForRide = (rideName) => {
        const norm = normalizeName(rideName);
        if (liveWaitTimes[norm]) return liveWaitTimes[norm];
        const foundKey = Object.keys(liveWaitTimes).find(
          k => k.includes(norm) || (norm.length > 6 && norm.includes(k))
        );
        return foundKey ? liveWaitTimes[foundKey] : null;
      };

      // Listen for Rides, Characters & Food updates from Firestore: trackers/familyProgress
      useEffect(() => {
        if (!db) return;
        const docRef = db.collection('trackers').doc('familyProgress');
        const unsubscribe = docRef.onSnapshot((doc) => {
          if (doc.exists) {
            const data = doc.data();
            if (data.rideState) setRideState(data.rideState);
            if (data.characterState) setCharacterState(data.characterState);
            if (data.foodState) setFoodState(data.foodState);
          }
        }, (error) => {
          console.error("Firestore Listen Error:", error);
        });
        return () => unsubscribe();
      }, []);

      // Listen for Individual Pass Price & Visits from Firestore: trackers/passTrackerV2
      useEffect(() => {
        if (!db) return;
        const passDocRef = db.collection('trackers').doc('passTrackerV2');
        const unsubscribe = passDocRef.onSnapshot((doc) => {
          if (doc.exists && doc.data().members) {
            setPassDataByMember(prev => ({
              ...prev,
              ...doc.data().members
            }));
          }
        }, (error) => {
          console.error("Firestore Pass Tracker Listen Error:", error);
        });
        return () => unsubscribe();
      }, []);

      // Toggle person check-off for Rides
      const togglePerson = (rideId, memberId) => {
        const currentRiders = rideState[rideId] || [];
        const isRidden = currentRiders.includes(memberId);
        const updated = isRidden
          ? currentRiders.filter(id => id !== memberId)
          : [...currentRiders, memberId];

        const nextState = { ...rideState, [rideId]: updated };
        setRideState(nextState);

        if (db) {
          db.collection('trackers').doc('familyProgress')
            .set({ rideState: nextState }, { merge: true })
            .catch(err => console.error("Firestore Save Error:", err));
        }
      };

      // Toggle person check-off for Characters
      const toggleCharacter = (charId, memberId) => {
        const currentVisitors = characterState[charId] || [];
        const isMet = currentVisitors.includes(memberId);
        const updated = isMet
          ? currentVisitors.filter(id => id !== memberId)
          : [...currentVisitors, memberId];

        const nextState = { ...characterState, [charId]: updated };
        setCharacterState(nextState);

        if (db) {
          db.collection('trackers').doc('familyProgress')
            .set({ characterState: nextState }, { merge: true })
            .catch(err => console.error("Firestore Character Save Error:", err));
        }
      };

      // Toggle person check-off for Food / Snacks
      const toggleFood = (foodId, memberId) => {
        const currentTasters = foodState[foodId] || [];
        const isTried = currentTasters.includes(memberId);
        const updated = isTried
          ? currentTasters.filter(id => id !== memberId)
          : [...currentTasters, memberId];

        const nextState = { ...foodState, [foodId]: updated };
        setFoodState(nextState);

        if (db) {
          db.collection('trackers').doc('familyProgress')
            .set({ foodState: nextState }, { merge: true })
            .catch(err => console.error("Firestore Food Save Error:", err));
        }
      };

      // Update Individual Annual Pass Price
      const handleSaveMemberPassPrice = (val) => {
        const updatedMemberData = {
          ...passDataByMember[selectedPassMember],
          price: val
        };
        const nextMembers = {
          ...passDataByMember,
          [selectedPassMember]: updatedMemberData
        };
        setPassDataByMember(nextMembers);

        if (db) {
          db.collection('trackers').doc('passTrackerV2')
            .set({ members: nextMembers }, { merge: true })
            .catch(err => console.error("Firestore Pass Price Save Error:", err));
        }
      };

      // Save a Park Visit for Selected Member (or All Family Members)
      const handleAddMemberVisit = (applyToAll = false) => {
        if (!visitDate) return;
        const targetIds = applyToAll ? FAMILY_MEMBERS.map(m => m.id) : [selectedPassMember];
        const nextMembers = { ...passDataByMember };

        targetIds.forEach(mId => {
          const current = nextMembers[mId] || { price: '', visits: [] };
          const newVisit = {
            id: `${Date.now()}-${mId}`,
            park: selectedPassPark,
            date: visitDate
          };
          nextMembers[mId] = {
            ...current,
            visits: [newVisit, ...(current.visits || [])].sort((a, b) => b.date.localeCompare(a.date))
          };
        });

        setPassDataByMember(nextMembers);

        if (db) {
          db.collection('trackers').doc('passTrackerV2')
            .set({ members: nextMembers }, { merge: true })
            .catch(err => console.error("Firestore Add Visit Error:", err));
        }
      };

      // Delete a Saved Park Visit for Selected Member
      const handleDeleteMemberVisit = (visitId) => {
        const current = passDataByMember[selectedPassMember] || { price: '', visits: [] };
        const updatedVisits = (current.visits || []).filter(v => v.id !== visitId);
        const nextMembers = {
          ...passDataByMember,
          [selectedPassMember]: {
            ...current,
            visits: updatedVisits
          }
        };
        setPassDataByMember(nextMembers);

        if (db) {
          db.collection('trackers').doc('passTrackerV2')
            .set({ members: nextMembers }, { merge: true })
            .catch(err => console.error("Firestore Delete Visit Error:", err));
        }
      };

      // Active Member Pass Calculations
      const activeMemberPass = passDataByMember[selectedPassMember] || { price: '', visits: [] };
      const memberNumericPrice = parseFloat(activeMemberPass.price) || 0;
      const memberVisitsList = activeMemberPass.visits || [];
      const memberCostPerVisit = memberVisitsList.length > 0 && memberNumericPrice > 0
        ? `$${(memberNumericPrice / memberVisitsList.length).toFixed(2)}`
        : '—';

      const filteredRides = RIDES_CATALOG.filter(r => {
        const matchesPark = activePark === 'ALL' || r.parkId === activePark;
        const matchesMember = activeMemberFilter === 'ALL' || (rideState[r.id] || []).includes(activeMemberFilter);
        return matchesPark && matchesMember;
      });

      const filteredCharacters = CHARACTERS_CATALOG.filter(c => {
        const matchesPark = activePark === 'ALL' || c.parkId === activePark;
        const matchesMember = activeMemberFilter === 'ALL' || (characterState[c.id] || []).includes(activeMemberFilter);
        return matchesPark && matchesMember;
      });

                        {FAMILY_MEMBERS.find(m => m.id === selectedPassMember)?.name}'s Visits
                      </h3>
                      <span className="bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-[11px] font-extrabold px-2.5 py-0.5 rounded-full">
                        {memberVisitsList.length}
                      </span>
                    </div>

                    {memberVisitsList.length === 0 ? (
                      <div className="bg-slate-800/50 border border-slate-700/70 rounded-2xl p-6 text-center space-y-1.5">
                        <div className="text-2xl opacity-60">🎟️</div>
                        <p className="text-xs text-slate-400">
                          No saved park visits for {FAMILY_MEMBERS.find(m => m.id === selectedPassMember)?.name} yet.
                        </p>
                      </div>
                    ) : (
                      <div className="space-y-2">
                        {memberVisitsList.map((visit) => {
                          const parkObj = PARKS_CATALOG.find(p => p.name === visit.park);
                          const [y, m, d] = visit.date.split('-');
                          const formattedDate = new Date(y, m - 1, d).toLocaleDateString('en-US', {
                            weekday: 'short',
                            month: 'long',
                            day: 'numeric',
                            year: 'numeric'
                          });

                          return (
                            <div
                              key={visit.id}
                              className="bg-slate-800/80 border border-slate-700/80 rounded-xl p-3 flex items-center justify-between"
                            >
                              <div className="flex items-center gap-2.5">
                                <span className="text-xl">{parkObj ? parkObj.icon : '🏰'}</span>
                                <div>
                                  <div className="font-bold text-slate-100 text-xs">{visit.park}</div>
                                  <div className="text-[10px] text-slate-400">{formattedDate}</div>
                                </div>
                              </div>
                              <button
                                onClick={() => handleDeleteMemberVisit(visit.id)}
                                className="text-slate-500 hover:text-rose-400 text-[10px] font-bold px-2 py-1 rounded-lg transition-colors"
                              >
                                Remove
                              </button>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </div>
              )}

            </main>

            {/* Detailed Card View Modal */}
            {selectedRide && (() => {
              const liveInfo = getLiveInfoForRide(selectedRide.name);
              return (
                <div className="absolute inset-0 z-50 bg-[#faf6ed] text-slate-900 flex flex-col overflow-y-auto">
                  {/* Header Image with Back & Heart Buttons */}
                  <div className="relative h-56 w-full shrink-0">
                    <img src={selectedRide.image} alt={selectedRide.name} className="w-full h-full object-cover" />
                    <button 
                      onClick={() => setSelectedRide(null)}
                      className="absolute top-4 left-4 w-9 h-9 bg-white/90 rounded-full flex items-center justify-center font-bold shadow text-slate-800 active:scale-95"
                    >
                      ❮
                    </button>
                    <button className="absolute top-4 right-4 w-9 h-9 bg-white/90 rounded-full flex items-center justify-center shadow text-pink-600 font-bold active:scale-95">
                      ♥
                    </button>
                  </div>

                  {/* Card Detail Content */}
                  <div className="p-5 pb-6 -mt-6 bg-[#faf6ed] rounded-t-3xl space-y-4">
                    <div>
                      <h2 className="text-2xl font-bold text-[#1b2240] leading-tight font-serif">{selectedRide.name}</h2>
                      <div className="flex flex-wrap items-center gap-2 mt-2">
                        <span className="inline-flex items-center space-x-1 px-3 py-1 bg-[#f4e6d4] text-[#8c5e31] rounded-full text-xs font-semibold">
                          <span>🏰</span>
                          <span>{selectedRide.land}</span>
                        </span>

                        {/* Live Wait Time Pill */}
                        <span className={`inline-flex items-center space-x-1.5 px-3 py-1 rounded-full text-xs font-bold ${
                          !liveInfo
                            ? 'bg-slate-200 text-slate-600'
                            : liveInfo.status === 'DOWN'
                            ? 'bg-rose-100 text-rose-800 border border-rose-300'
                            : liveInfo.status === 'CLOSED'
                            ? 'bg-slate-200 text-slate-700'
                            : 'bg-emerald-100 text-emerald-900 border border-emerald-300'
                        }`}>
                          <span>⏳</span>
                          <span>
                            {!liveInfo
                              ? 'Live Wait Unavailable'
                              : liveInfo.status === 'DOWN'
                              ? 'Temporarily Down'
                              : liveInfo.status === 'CLOSED'
                              ? 'Park / Ride Closed'
                              : liveInfo.waitTime !== null
                              ? `${liveInfo.waitTime} min Standby Wait`
                              : 'Operating (No Posted Wait)'}
                          </span>
                        </span>
                      </div>
                    </div>

                    {/* Who Rode This Ride? */}
                    <div className="bg-white/80 p-3.5 rounded-2xl border border-[#e8dcc8] space-y-2.5 shadow-sm">
                      <div className="text-[11px] font-bold text-[#1b2240] uppercase tracking-wide">Who Rode This Ride?</div>
                      <div className="grid grid-cols-2 gap-2">
                        {FAMILY_MEMBERS.map(m => {
                          const checked = (rideState[selectedRide.id] || []).includes(m.id);
                          return (
                            <button
                              key={m.id}
                              onClick={() => togglePerson(selectedRide.id, m.id)}
                              className={`flex items-center space-x-2 p-2 rounded-xl border transition-all text-xs font-bold ${
                                checked ? 'bg-emerald-100 border-emerald-500 text-emerald-900' : 'bg-[#faf6ed] border-slate-300 text-slate-700'
                              }`}
                            >
                              <img src={m.avatarImg} alt={m.name} className="w-6 h-6 rounded-full object-cover" />
                              <span>{m.name}</span>
                              <span className="ml-auto font-black">{checked ? '✓' : '+'}</span>
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    <p className="text-xs text-slate-600 leading-relaxed font-medium">
                      {selectedRide.description}
                    </p>

                    <div className="space-y-3 pt-1 text-xs">
                      {/* Live Wait Time Row */}
                      <div className="flex items-center space-x-3.5">
                        <div className="w-6 text-center text-[#1b2240] text-lg font-bold">⏳</div>
                        <div>
                          <div className="font-semibold text-slate-500 text-[10px]">
                            Live Wait Time {lastWaitUpdate ? `(Updated ${lastWaitUpdate.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })})` : ''}
                          </div>
                          <div className="font-bold text-[#1b2240] text-xs">
                            {!liveInfo
                              ? 'Checking ThemeParks.wiki...'
                              : liveInfo.status === 'DOWN'
                              ? 'Temporarily Closed / Down'
                              : liveInfo.status === 'CLOSED'
                              ? 'Closed'
                              : liveInfo.waitTime !== null
                              ? `${liveInfo.waitTime} minutes`
                              : 'Open (Walk-on / No Standby Posted)'}
                          </div>
                        </div>
                      </div>

                      {/* Thrill Level */}
                      <div className="flex items-center space-x-3.5">
                        <div className="w-6 text-center text-[#1b2240] text-lg font-bold">🎢</div>
                        <div>
                          <div className="font-semibold text-slate-500 text-[10px]">Thrill Level</div>
                          <div className="flex space-x-1 mt-0.5">
                            {[1, 2, 3, 4, 5].map((star) => (
                              <span key={star} className={star <= selectedRide.thrillLevel ? "text-[#1b2240] text-sm" : "text-slate-300 text-sm"}>
                                🐭
                              </span>
                            ))}
                          </div>
                        </div>
                      </div>

                      {/* Height Requirement */}
                      <div className="flex items-center space-x-3.5">
                        <div className="w-6 text-center text-[#1b2240] text-lg font-bold">🧍</div>
                        <div>
                          <div className="font-semibold text-slate-500 text-[10px]">Height Requirement</div>
                          <div className="font-bold text-[#1b2240] text-xs">{selectedRide.heightRequirement}</div>
                        </div>
                      </div>

                      {/* Ride Type */}
                      <div className="flex items-center space-x-3.5">
                        <div className="w-6 text-center text-[#1b2240] text-lg font-bold">🎟️</div>
                        <div>
                          <div className="font-semibold text-slate-500 text-[10px]">Ride Type</div>
                          <div className="font-bold text-[#1b2240] text-xs">{selectedRide.rideType}</div>
                        </div>
                      </div>

                      {/* Duration */}
                      <div className="flex items-center space-x-3.5">
                        <div className="w-6 text-center text-[#1b2240] text-lg font-bold">⏱️</div>
                        <div>
                          <div className="font-semibold text-slate-500 text-[10px]">Duration</div>
                          <div className="font-bold text-[#1b2240] text-xs">{selectedRide.duration}</div>
                        </div>
                      </div>
                    </div>

                    <button 
                      onClick={() => setSelectedRide(null)}
                      className="w-full mt-1 py-3 bg-[#ffc844] hover:bg-[#f5bc33] text-slate-950 rounded-2xl font-bold text-xs shadow-md"
                    >
                      Done / Back to Rides
                    </button>
                  </div>
                </div>
              );
            })()}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
