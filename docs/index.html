    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [activePark, setActivePark] = useState('mk');
      const [activeMemberFilter, setActiveMemberFilter] = useState('ALL');
      const [rideState, setRideState] = useState({});
      const [foodState, setFoodState] = useState({});
      const [characterState, setCharacterState] = useState({});
      const [selectedRide, setSelectedRide] = useState(null);

      // Listen for updates from Firestore document: trackers/familyProgress
      useEffect(() => {
        if (!db) return;
        const docRef = db.collection('trackers').doc('familyProgress');
        const unsubscribe = docRef.onSnapshot((doc) => {
          if (doc.exists) {
            const data = doc.data();
            if (data.rideState) setRideState(data.rideState);
            if (data.foodState) setFoodState(data.foodState);
            if (data.characterState) setCharacterState(data.characterState);
          }
        }, (error) => {
          console.error("Firestore Listen Error:", error);
        });
        return () => unsubscribe();
      }, []);

      // Toggle person ride check-off and write to Firestore
      const togglePerson = (rideId, memberId) => {
        const currentRiders = rideState[rideId] || [];
        const isRidden = currentRiders.includes(memberId);
        const updated = isRidden 
          ? currentRiders.filter(id => id !== memberId) 
          : [...currentRiders, memberId];
        
        const nextState = { ...rideState, [rideId]: updated };
        setRideState(nextState);

        if (db) {
          db.collection('trackers').doc('familyProgress')
            .set({ rideState: nextState }, { merge: true })
            .catch(err => console.error("Firestore Save Error:", err));
        }
      };

      // Toggle person food check-off and write to Firestore
      const toggleFood = (rideId, memberId) => {
        const currentEaters = foodState[rideId] || [];
        const isTried = currentEaters.includes(memberId);
        const updated = isTried
          ? currentEaters.filter(id => id !== memberId)
          : [...currentEaters, memberId];

        const nextFoodState = { ...foodState, [rideId]: updated };
        setFoodState(nextFoodState);

        if (db) {
          db.collection('trackers').doc('familyProgress')
            .set({ foodState: nextFoodState }, { merge: true })
            .catch(err => console.error("Firestore Food Save Error:", err));
        }
      };

      // Toggle person character check-off and write to Firestore
      const toggleCharacter = (charId, memberId) => {
        const currentMeeters = characterState[charId] || [];
        const isMet = currentMeeters.includes(memberId);
        const updated = isMet
          ? currentMeeters.filter(id => id !== memberId)
          : [...currentMeeters, memberId];

        const nextCharState = { ...characterState, [charId]: updated };
        setCharacterState(nextCharState);

        if (db) {
          db.collection('trackers').doc('familyProgress')
            .set({ characterState: nextCharState }, { merge: true })
            .catch(err => console.error("Firestore Character Save Error:", err));
        }
      };

      const filteredRides = RIDES_CATALOG.filter(r => {
        const matchesPark = activePark === 'ALL' || r.parkId === activePark;
        const matchesMember = activeMemberFilter === 'ALL' || 
          (rideState[r.id] || []).includes(activeMemberFilter) || 
          (foodState[r.id] || []).includes(activeMemberFilter);
        return matchesPark && matchesMember;
      });

      const filteredCharacters = CHARACTERS_CATALOG.filter(c => {
        const matchesPark = activePark === 'ALL' || c.parkId === activePark;
        const matchesMember = activeMemberFilter === 'ALL' || (characterState[c.id] || []).includes(activeMemberFilter);
        return matchesPark && matchesMember;
      });

      return (
        <div className="flex justify-center p-0 sm:p-4">
          <div className="w-full max-w-md bg-slate-900 min-h-screen sm:min-h-[850px] sm:rounded-3xl border border-slate-800 flex flex-col overflow-hidden shadow-2xl relative font-sans">
            
            {/* Main Header */}

                    <p className="text-xs text-slate-300 mt-1">Track family ride completions, character greetings, and park snacks all in real-time across devices.</p>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div 
                      onClick={() => setActiveTab('rides')}

                      <div className="text-2xl mb-1">🎢</div>

                      <div className="text-[10px] text-slate-400">{RIDES_CATALOG.length} attractions cataloged</div>
                    </div>

                    <div

                      <div className="text-2xl mb-1">👑</div>
                      <div className="text-xs font-bold text-slate-200">Meet Characters</div>

                    </div>
                  </div>

                  {/* Family Member Quick Cards */}
                  <div className="space-y-3 mt-4">
                    <h3 className="text-xs font-bold uppercase tracking-wider text-amber-300/80">Family Members</h3>
                    {FAMILY_MEMBERS.map(member => {
                      const memberCompletedRides = Object.values(rideState).filter(riders => riders.includes(member.id)).length;

                      return (
                        <div key={member.id} className="bg-slate-800/40 border border-slate-700/40 rounded-xl p-3 flex items-center gap-3">
                          <img src={member.avatarImg} alt={member.name} className="w-12 h-12 rounded-full object-cover border border-amber-400/40" />

                                  {ride.name}
                                </h4>
                                <span className="text-[10px] bg-slate-900 text-slate-400 px-2 py-0.5 rounded-md border border-slate-700 whitespace-nowrap flex-shrink-0">
                                  {ride.land}
                                </span>
                              </div>
                              <p className="text-[11px] text-slate-300 mt-1 line-clamp-2">{ride.description}</p>
                              
                              <div className="flex items-center gap-2 mt-2 text-[10px] text-slate-400">
                                <span>⏱️ {ride.duration}</span>
                                <span>•</span>
                                <span>⚠️ Thrill: {ride.thrillLevel}/5</span>
                              </div>
                            </div>
                          </div>

                          {/* Family Member Checkboxes for Rides & Food */}
                          <div className="bg-slate-900/80 px-3 py-2 border-t border-slate-800 space-y-2">
                            {/* Ride / Visit Row */}
                            <div className="flex items-center justify-between">
                              <span className="text-[10px] font-bold text-slate-400 w-12 flex-shrink-0">🎢 Ride</span>
                              <div className="grid grid-cols-4 gap-1.5 flex-1 ml-1">
                                {FAMILY_MEMBERS.map(member => {
                                  const hasRidden = riders.includes(member.id);
                                  return (
                                    <button
                                      key={member.id}
                                      onClick={() => togglePerson(ride.id, member.id)}
                                      className={`flex items-center justify-center gap-1 py-1 rounded-lg text-[10px] font-bold transition-all border ${hasRidden ? 'bg-amber-400/20 text-amber-300 border-amber-400/50' : 'bg-slate-800 text-slate-400 border-slate-700 hover:border-slate-600'}`}
                                    >
                                      <span>{hasRidden ? '✅' : '⭕'}</span>
                                      <span className="truncate">{member.name}</span>
                                    </button>
                                  );
                                })}
                              </div>
                            </div>

                            {/* Food / Snacks Row (Visible on All Attractions & EPCOT Pavilions) */}
                            <div className="flex items-center justify-between pt-1.5 border-t border-slate-800/80">
                              <span className="text-[10px] font-bold text-emerald-400 w-12 flex-shrink-0">🥨 Food</span>
                              <div className="grid grid-cols-4 gap-1.5 flex-1 ml-1">
                                {FAMILY_MEMBERS.map(member => {
                                  const hasEaten = eaters.includes(member.id);
                                  return (
                                    <button
                                      key={member.id}
                                      onClick={() => toggleFood(ride.id, member.id)}
                                      className={`flex items-center justify-center gap-1 py-1 rounded-lg text-[10px] font-bold transition-all border ${hasEaten ? 'bg-emerald-400/20 text-emerald-300 border-emerald-400/50' : 'bg-slate-800 text-slate-400 border-slate-700 hover:border-slate-600'}`}
                                    >
                                      <span>{hasEaten ? '😋' : '⭕'}</span>
                                      <span className="truncate">{member.name}</span>
                                    </button>
                                  );
                                })}
                              </div>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* CHARACTERS TAB */}
              {activeTab === 'characters' && (
                <div>
                  {/* Parks Filter Tabs */}
                  <div className="flex gap-2 overflow-x-auto pb-2 mb-3 no-scrollbar">
                    {PARKS_CATALOG.map(park => (
                      <button
                        key={park.id}
                        onClick={() => setActivePark(park.id)}
                        className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all flex items-center gap-1.5 ${activePark === park.id ? 'bg-amber-400 text-slate-950 font-extrabold shadow-lg shadow-amber-400/20' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                      >
                        <span>{park.icon}</span>
                        <span>{park.name}</span>
                      </button>
                    ))}
                  </div>

                  <div className="space-y-3">
                    <div className="bg-slate-800/40 border border-slate-700/50 p-3 rounded-xl text-xs text-slate-300 text-center">
                      👑 Tap family members below to check off character meet & greets!
                    </div>

                    {filteredCharacters.map(char => {
                      const meeters = characterState[char.id] || [];
                      return (
                        <div key={char.id} className="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-3 flex flex-col gap-2">
                          <div className="flex justify-between items-start">
                            <div>
                              <h4 className="font-bold text-sm text-amber-100">{char.name}</h4>
                              <p className="text-[11px] text-slate-400">📍 {char.location} ({char.parkName})</p>
                            </div>
                          </div>

                          <div className="grid grid-cols-4 gap-1.5 pt-2 border-t border-slate-800">
                            {FAMILY_MEMBERS.map(member => {
                              const isMet = meeters.includes(member.id);
                              return (
                                <button
                                  key={member.id}
                                  onClick={() => toggleCharacter(char.id, member.id)}
                                  className={`flex items-center justify-center gap-1 py-1 rounded-lg text-[10px] font-bold transition-all border ${isMet ? 'bg-pink-500/20 text-pink-300 border-pink-500/50' : 'bg-slate-800 text-slate-400 border-slate-700'}`}
                                >
                                  <span>{isMet ? '💖' : '🤍'}</span>
                                  <span className="truncate">{member.name}</span>
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* STATS TAB */}
              {activeTab === 'stats' && (
                <div className="space-y-4">
                  <h2 className="text-md font-serif font-bold text-amber-200 text-center">Family Adventure Progress</h2>
                  
                  {FAMILY_MEMBERS.map(member => {
                    const memberRides = Object.values(rideState).filter(r => r.includes(member.id)).length;
                    const memberFoods = Object.values(foodState).filter(f => f.includes(member.id)).length;
                    const memberChars = Object.values(characterState).filter(c => c.includes(member.id)).length;
                    const ridePct = Math.round((memberRides / RIDES_CATALOG.length) * 100);

                    return (
                      <div key={member.id} className="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-4 space-y-2">
                        <div className="flex items-center gap-3">
                          <img src={member.avatarImg} alt={member.name} className="w-10 h-10 rounded-full object-cover border border-amber-400" />
                          <div>
                            <h3 className="font-bold text-sm text-slate-100">{member.name}</h3>
                            <p className="text-[10px] text-amber-300 font-semibold">{member.tagline}</p>
                          </div>
                        </div>

                        <div className="grid grid-cols-3 gap-2 pt-2 text-center">
                          <div className="bg-slate-900/60 p-2 rounded-xl border border-slate-800">
                            <div className="text-base font-bold text-amber-300">{memberRides} / {RIDES_CATALOG.length}</div>
                            <div className="text-[9px] text-slate-400">Rides</div>
                          </div>
                          <div className="bg-slate-900/60 p-2 rounded-xl border border-slate-800">
                            <div className="text-base font-bold text-emerald-300">{memberFoods}</div>
                            <div className="text-[9px] text-slate-400">Foods/Snacks</div>
                          </div>
                          <div className="bg-slate-900/60 p-2 rounded-xl border border-slate-800">
                            <div className="text-base font-bold text-pink-300">{memberChars}</div>
                            <div className="text-[9px] text-slate-400">Characters</div>
                          </div>
                        </div>

                        <div className="w-full bg-slate-900 h-2 rounded-full overflow-hidden mt-2">
                          <div className={`bg-gradient-to-r ${member.barColor} h-full`} style={{ width: `${ridePct}%` }}></div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}

            </main>

            {/* Ride Detail Modal */}
            {selectedRide && (
              <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-slate-900 border border-slate-700 rounded-3xl w-full max-w-sm max-h-[90vh] overflow-y-auto shadow-2xl flex flex-col no-scrollbar">
                  <div className="relative h-48 flex-shrink-0">
                    <img src={selectedRide.image} alt={selectedRide.name} className="w-full h-full object-cover" />
                    <button 
                      onClick={() => setSelectedRide(null)}
                      className="absolute top-3 right-3 bg-slate-900/80 text-slate-200 w-8 h-8 rounded-full flex items-center justify-center font-bold hover:bg-slate-800"
                    >
                      ✕
                    </button>
                  </div>
                  <div className="p-4 space-y-3">
                    <div className="flex justify-between items-start gap-2">
                      <h3 className="text-lg font-serif font-bold text-amber-100">{selectedRide.name}</h3>
                      <span className="text-xs bg-slate-800 text-amber-300 px-2 py-0.5 rounded-md border border-slate-700 whitespace-nowrap">{selectedRide.land}</span>
                    </div>
                    <p className="text-xs text-slate-300">{selectedRide.description}</p>
                    
                    <div className="grid grid-cols-2 gap-2 text-xs bg-slate-800/50 p-3 rounded-xl border border-slate-700/50">
                      <div><strong className="text-slate-400">Duration:</strong> {selectedRide.duration}</div>
                      <div><strong className="text-slate-400">Thrill Level:</strong> {selectedRide.thrillLevel}/5</div>
                      <div><strong className="text-slate-400">Height:</strong> {selectedRide.heightRequirement}</div>
                      <div><strong className="text-slate-400">Type:</strong> {selectedRide.rideType}</div>
                    </div>

                    <button 
                      onClick={() => setSelectedRide(null)}
                      className="w-full py-2.5 bg-amber-400 text-slate-950 font-bold rounded-xl text-xs hover:bg-amber-300 transition-all"
                    >
                      Close
                    </button>
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
