<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Underwood Adventures</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Firebase Setup ---
    const firebaseConfig = {
      apiKey: "demo-api-key",
      authDomain: "demo-app.firebaseapp.com",
      projectId: "demo-app",
      storageBucket: "demo-app.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // Underwood Family Profiles
    const FAMILY_MEMBERS = [
      {
        id: 'mom',
        name: 'Mom',
        tagline: 'MAKING MAGIC TOGETHER',
        ribbonStyle: 'bg-gradient-to-r from-pink-300 via-purple-200 to-pink-300 text-purple-950 border-pink-300',
        barColor: 'from-pink-400 via-purple-400 to-indigo-500',
        avatarImg: 'https://github.com/desmaunderwood-create/underwooddisneytracker/blob/main/docs/dez.png?raw=true'
      },
      {
        id: 'dad',
        name: 'Dad',
        tagline: 'BIG PLANS MORE RIDES',
        ribbonStyle: 'bg-gradient-to-r from-sky-300 via-blue-200 to-indigo-300 text-slate-950 border-sky-300',
        barColor: 'from-sky-400 via-blue-500 to-indigo-600',
        avatarImg: 'https://github.com/desmaunderwood-create/underwooddisneytracker/blob/main/docs/greg.png?raw=true'
      },
      {
        id: 'emma',
        name: 'Emma',
        tagline: 'DREAM IT RIDE IT',
        ribbonStyle: 'bg-gradient-to-r from-rose-300 via-pink-200 to-rose-300 text-rose-950 border-rose-300',
        barColor: 'from-rose-400 via-pink-400 to-pink-600',
        avatarImg: 'https://github.com/desmaunderwood-create/underwooddisneytracker/blob/main/docs/emma.png?raw=true'
      },
      {
        id: 'harper',
        name: 'Harper',
        tagline: 'MORE SMILES BIGGER ADVENTURES',
        ribbonStyle: 'bg-gradient-to-r from-amber-200 via-purple-200 to-amber-200 text-purple-950 border-purple-300',
        barColor: 'from-purple-400 via-pink-400 to-amber-400',
        avatarImg: 'https://github.com/desmaunderwood-create/underwooddisneytracker/blob/main/docs/harper.png?raw=true'
      }
    ];

    // Disney World Parks Catalog
    const PARKS_CATALOG = [
      { id: 'mk', name: 'Magic Kingdom', icon: '🏰' },
      { id: 'epcot', name: 'EPCOT', icon: '🌐' },
      { id: 'hs', name: "Hollywood Studios", icon: '🎬' },
      { id: 'ak', name: "Animal Kingdom", icon: '🌴' }
    ];

    // Complete Rides List
    const RIDES_CATALOG = [
      // Magic Kingdom
      { id: 'big-thunder', parkId: 'mk', name: 'Big Thunder Mountain Railroad', land: 'Frontierland', duration: '3.5 min', image: 'https://images.unsplash.com/photo-1506197603052-3cc9c3a201bd?auto=format&fit=crop&q=80&w=800', description: 'A high-speed train adventure through mining caves, desert canyons and surprising twists!' },
      { id: 'space-mountain', parkId: 'mk', name: 'Space Mountain', land: 'Tomorrowland', duration: '3 min', image: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&q=80&w=800', description: 'Dip and dive through outer space on a high-speed rocket flight!' },
      { id: 'pirates-caribbean', parkId: 'mk', name: 'Pirates of the Caribbean', land: 'Adventureland', duration: '8.5 min', image: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&q=80&w=800', description: 'Set sail on a swashbuckling voyage through pirate waters.' },
      { id: 'haunted-mansion', parkId: 'mk', name: 'Haunted Mansion', land: 'Liberty Square', duration: '9 min', image: 'https://images.unsplash.com/photo-1508873696983-2df515122519?auto=format&fit=crop&q=80&w=800', description: 'Doom Buggy tour through a estate home to 999 happy haunts.' },
      { id: 'seven-dwarfs', parkId: 'mk', name: 'Seven Dwarfs Mine Train', land: 'Fantasyland', duration: '2.5 min', image: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&q=80&w=800', description: 'Race through the diamond mine on a swinging coaster car.' },

      // EPCOT
      { id: 'guardians-rewind', parkId: 'epcot', name: 'Guardians of the Galaxy: Cosmic Rewind', land: 'World Discovery', duration: '3.5 min', image: 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&q=80&w=800', description: 'Intergalactic coaster chase through space with Star-Lord.' },
      { id: 'remys-ratatouille', parkId: 'epcot', name: "Remy's Ratatouille Adventure", land: 'France', duration: '4.5 min', image: 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&q=80&w=800', description: 'Shrink down to Remy size and zip through Paris kitchen.' },
      
      // Hollywood Studios
      { id: 'rise-resistance', parkId: 'hs', name: 'Star Wars: Rise of the Resistance', land: "Galaxy's Edge", duration: '18 min', image: 'https://images.unsplash.com/photo-1579566346927-c68383817a25?auto=format&fit=crop&q=80&w=800', description: 'Join the Resistance in a massive battle against First Order!' },
      { id: 'slinky-dog', parkId: 'hs', name: 'Slinky Dog Dash', land: 'Toy Story Land', duration: '2 min', image: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&q=80&w=800', description: 'Zip around Andy backyard on Slinky Dog mega coaster.' },

      // Animal Kingdom
      { id: 'flight-of-passage', parkId: 'ak', name: 'Avatar Flight of Passage', land: 'Pandora', duration: '5 min', image: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&q=80&w=800', description: 'Fly on a mountain banshee over Pandora.' },
      { id: 'expedition-everest', parkId: 'ak', name: 'Expedition Everest', land: 'Asia', duration: '3.5 min', image: 'https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&q=80&w=800', description: 'Coaster through icy Himalayan peaks while escaping Yeti.' }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [activePark, setActivePark] = useState('mk');
      const [rideState, setRideState] = useState({});

      useEffect(() => {
        const docRef = db.collection('artifacts').doc('underwood-tracker').collection('public').doc('global_state');
        const unsubscribe = docRef.onSnapshot((doc) => {
          if (doc.exists && doc.data().rideState) {
            setRideState(doc.data().rideState);
          }
        });
        return () => unsubscribe();
      }, []);

      const togglePerson = (rideId, memberId) => {
        const currentRiders = rideState[rideId] || [];
        const isRidden = currentRiders.includes(memberId);
        const updated = isRidden 
          ? currentRiders.filter(id => id !== memberId) 
          : [...currentRiders, memberId];
        
        const nextState = { ...rideState, [rideId]: updated };
        setRideState(nextState);

        db.collection('artifacts').doc('underwood-tracker').collection('public').doc('global_state')
          .set({ rideState: nextState }, { merge: true })
          .catch(err => console.error(err));
      };

      const filteredRides = RIDES_CATALOG.filter(r => activePark === 'ALL' || r.parkId === activePark);

      return (
        <div className="flex justify-center p-0 sm:p-4">
          <div className="w-full max-w-md bg-slate-900 min-h-screen sm:min-h-[850px] sm:rounded-3xl border border-slate-800 flex flex-col overflow-hidden shadow-2xl">
            
            {/* Header */}
            <header className="p-4 bg-gradient-to-b from-purple-950 to-indigo-950 border-b border-amber-300/30 text-center">
              <div className="text-[10px] uppercase font-bold text-amber-300 tracking-widest">Happiness Rides Here ♡</div>
              <h1 className="text-xl font-bold font-serif text-amber-100 mt-1">Underwood Adventures</h1>
              
              {/* Family Avatars Header */}
              <div className="flex justify-around mt-4">
                {FAMILY_MEMBERS.map(m => (
                  <div key={m.id} className="flex flex-col items-center">
                    <img src={m.avatarImg} alt={m.name} className="w-12 h-12 rounded-full border-2 border-amber-300 object-cover shadow-md" />
                    <span className="text-[10px] font-bold mt-1 text-slate-200">{m.name}</span>
                  </div>
                ))}
              </div>
            </header>

            {/* Content Body */}
            <main className="flex-1 p-3 space-y-3 overflow-y-auto pb-20">
              
              {activeTab === 'home' && (
                <>
                  {/* Park Filters */}
                  <div className="flex gap-1 overflow-x-auto no-scrollbar pb-1">
                    <button 
                      onClick={() => setActivePark('ALL')} 
                      className={`px-3 py-1 rounded-full text-xs font-bold ${activePark === 'ALL' ? 'bg-amber-400 text-slate-950' : 'bg-slate-800 text-slate-300'}`}
                    >
                      All Parks
                    </button>
                    {PARKS_CATALOG.map(p => (
                      <button 
                        key={p.id} 
                        onClick={() => setActivePark(p.id)} 
                        className={`px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap ${activePark === p.id ? 'bg-purple-600 text-white' : 'bg-slate-800 text-slate-300'}`}
                      >
                        {p.icon} {p.name}
                      </button>
                    ))}
                  </div>

                  {/* Ride List */}
                  <div className="space-y-2.5">
                    {filteredRides.map(ride => {
                      const riders = rideState[ride.id] || [];
                      return (
                        <div key={ride.id} className="bg-slate-800/80 p-3 rounded-2xl border border-slate-700">
                          <div className="flex space-x-3">
                            <img src={ride.image} alt={ride.name} className="w-14 h-14 rounded-xl object-cover" />
                            <div className="flex-1">
                              <h3 className="text-xs font-bold text-slate-100">{ride.name}</h3>
                              <div className="text-[10px] text-amber-300 font-semibold">{ride.land} • {ride.duration}</div>

                              {/* Per-Person Toggles */}
                              <div className="mt-2.5 pt-2 border-t border-slate-700/60 flex items-center justify-between">
                                <span className="text-[9px] font-bold text-slate-400 uppercase">Who Rode?</span>
                                <div className="flex space-x-2">
                                  {FAMILY_MEMBERS.map(m => {
                                    const checked = riders.includes(m.id);
                                    return (
                                      <button
                                        key={m.id}
                                        onClick={() => togglePerson(ride.id, m.id)}
                                        className={`relative w-7 h-7 rounded-full overflow-hidden border-2 transition-all ${
                                          checked ? 'border-emerald-400 ring-2 ring-emerald-400/40' : 'border-slate-600 opacity-40'
                                        }`}
                                      >
                                        <img src={m.avatarImg} alt={m.name} className="w-full h-full object-cover" />
                                        {checked && (
                                          <div className="absolute inset-0 bg-emerald-500/30 flex items-center justify-center font-bold text-white text-[10px]">
                                            ✓
                                          </div>
                                        )}
                                      </button>
                                    );
                                  })}
                                </div>
                              </div>

                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </>
              )}

              {activeTab === 'stats' && (
                <div className="space-y-3">
                  <h2 className="text-sm font-bold text-slate-100 uppercase">Family Ride Stats</h2>
                  <div className="bg-slate-800 p-4 rounded-2xl space-y-3">
                    {FAMILY_MEMBERS.map(m => {
                      const count = Object.values(rideState).filter(r => r.includes(m.id)).length;
                      const pct = Math.round((count / RIDES_CATALOG.length) * 100);
                      return (
                        <div key={m.id} className="space-y-1">
                          <div className="flex justify-between text-xs">
                            <span className="font-bold text-slate-200">{m.name}</span>
                            <span className="font-bold text-amber-300">{count} rides ({pct}%)</span>
                          </div>
                          <div className="w-full bg-slate-900 h-2 rounded-full overflow-hidden">
                            <div className={`h-full bg-gradient-to-r ${m.barColor}`} style={{ width: `${pct}%` }}></div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

            </main>

            {/* Bottom Nav */}
            <nav className="h-14 bg-slate-950 border-t border-slate-800 flex justify-around items-center">
              <button onClick={() => setActiveTab('home')} className={`text-xs font-bold ${activeTab === 'home' ? 'text-amber-400' : 'text-slate-400'}`}>
                🏰 Rides
              </button>
              <button onClick={() => setActiveTab('stats')} className={`text-xs font-bold ${activeTab === 'stats' ? 'text-amber-400' : 'text-slate-400'}`}>
                📊 Leaderboard
              </button>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
