    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [activePark, setActivePark] = useState('mk');
      const [activeMember, setActiveMember] = useState('mom');
      const [rideState, setRideState] = useState({});
      const [selectedRide, setSelectedRide] = useState(null);

      // Listen for updates from Firestore document: trackers/familyProgress
      useEffect(() => {
        if (!db) return;
        const docRef = db.collection('trackers').doc('familyProgress');
        const unsubscribe = docRef.onSnapshot((doc) => {
          if (doc.exists && doc.data().rideState) {
            setRideState(doc.data().rideState);
          }
        }, (error) => {
          console.error("Firestore Listen Error:", error);
        });
        return () => unsubscribe();
      }, []);

      // Toggle person check-off and write to Firestore
      const togglePerson = (rideId, memberId) => {
        const currentRiders = rideState[rideId] || [];
        const isRidden = currentRiders.includes(memberId);
        const updated = isRidden 
          ? currentRiders.filter(id => id !== memberId) 
          : [...currentRiders, memberId];
        
        const nextState = { ...rideState, [rideId]: updated };
        setRideState(nextState);

        if (db) {
          db.collection('trackers').doc('familyProgress')
            .set({ rideState: nextState }, { merge: true })
            .catch(err => console.error("Firestore Save Error:", err));
        }
      };

      const filteredRides = RIDES_CATALOG.filter(r => activePark === 'ALL' || r.parkId === activePark);

      return (
        <div className="flex justify-center p-0 sm:p-4">
          <div className="w-full max-w-md bg-slate-900 min-h-screen sm:min-h-[850px] sm:rounded-3xl border border-slate-800 flex flex-col overflow-hidden shadow-2xl relative font-sans">
            
            {/* Main Header */}
            <header className="p-4 bg-gradient-to-b from-purple-950 via-slate-900 to-indigo-950 border-b border-amber-300/30 text-center">
              <div className="text-[10px] uppercase font-bold text-amber-300 tracking-widest">Happiness Rides Here ♡</div>
              <h1 className="text-xl font-bold font-serif text-amber-100 mt-1">Underwood Adventures</h1>
              
              {/* Family Member Avatars */}
              <div className="flex justify-around mt-4">
                {FAMILY_MEMBERS.map(m => (
                  <button 
                    key={m.id} 
                    onClick={() => setActiveMember(m.id)}
                    className={`flex flex-col items-center transition-all ${activeMember === m.id ? 'scale-110 opacity-100' : 'opacity-70'}`}
                  >
                    <div className={`w-12 h-12 rounded-full p-0.5 border-2 ${activeMember === m.id ? 'border-amber-400 ring-2 ring-amber-400/40' : 'border-slate-700'}`}>
                      <img 
                        src={m.avatarImg} 
                        alt={m.name} 
                        className="w-full h-full rounded-full object-cover" 
                        onError={(e) => { e.target.src = 'https://placehold.co/100x100/1e293b/f59e0b?text=' + m.name; }}
                      />
                    </div>
                    <span className="text-[10px] font-bold mt-1 text-slate-200">{m.name}</span>
                  </button>
                ))}
              </div>
            </header>

            {/* Content Body */}
            <main className="flex-1 p-3 space-y-3 overflow-y-auto pb-20">
              
              {activeTab === 'home' && (
                <>
                  {/* Park Filters */}
                  <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
                    <button 
                      onClick={() => setActivePark('ALL')} 
                      className={`px-3 py-1.5 rounded-full text-xs font-bold transition-all ${activePark === 'ALL' ? 'bg-amber-400 text-slate-950' : 'bg-slate-800 text-slate-300'}`}
                    >
                      All Parks
                    </button>
                    {PARKS_CATALOG.map(p => (
                      <button 
                        key={p.id} 
                        onClick={() => setActivePark(p.id)} 
                        className={`px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all ${activePark === p.id ? 'bg-purple-600 text-white' : 'bg-slate-800 text-slate-300'}`}
                      >
                        {p.icon} {p.name}
                      </button>
                    ))}
                  </div>

                  {/* Ride List */}
                  <div className="space-y-2.5">
                    {filteredRides.map(ride => {
                      const riders = rideState[ride.id] || [];
                      return (
                        <div key={ride.id} className="bg-slate-800/80 hover:bg-slate-800 p-3 rounded-2xl border border-slate-700/80 transition-all">
                          <div className="flex space-x-3 cursor-pointer" onClick={() => setSelectedRide(ride)}>
                            <img src={ride.image} alt={ride.name} className="w-16 h-16 rounded-xl object-cover shrink-0" />
                            <div className="flex-1 min-w-0">
                              <h3 className="text-xs font-bold text-slate-100 flex items-center justify-between">
                                <span className="truncate">{ride.name}</span>
                                <span className="text-[10px] text-amber-400 font-semibold shrink-0 ml-1">Details ➔</span>
                              </h3>
                              <div className="text-[10px] text-amber-300 font-semibold">{ride.land} • {ride.duration}</div>
                              <p className="text-[10px] text-slate-400 line-clamp-1 mt-0.5">{ride.description}</p>
                            </div>
                          </div>

                          {/* Family Check-off Row */}
                          <div className="mt-2.5 pt-2 border-t border-slate-700/60 flex items-center justify-between">
                            <span className="text-[9px] font-bold text-slate-400 uppercase">Who Rode?</span>
                            <div className="flex space-x-2">
                              {FAMILY_MEMBERS.map(m => {
                                const checked = riders.includes(m.id);
                                return (
                                  <button
                                    key={m.id}
                                    onClick={(e) => {
                                      e.stopPropagation();
                                      togglePerson(ride.id, m.id);
                                    }}
                                    className={`relative w-8 h-8 rounded-full overflow-hidden border-2 transition-all ${
                                      checked ? 'border-emerald-400 ring-2 ring-emerald-400/40 scale-105' : 'border-slate-600 opacity-40 hover:opacity-75'
                                    }`}
                                  >
                                    <img 
                                      src={m.avatarImg} 
                                      alt={m.name} 
                                      className="w-full h-full object-cover" 
                                      onError={(e) => { e.target.src = 'https://placehold.co/100x100/1e293b/f59e0b?text=' + m.name; }}
                                    />
                                    {checked && (
                                      <div className="absolute inset-0 bg-emerald-500/50 flex items-center justify-center font-bold text-white text-xs">
                                        ✓
                                      </div>
                                    )}
                                  </button>
                                );
                              })}
                            </div>
                          </div>

                        </div>
                      );
                    })}
                  </div>
                </>
              )}

              {activeTab === 'stats' && (
                <div className="space-y-4">
                  <h2 className="text-sm font-bold text-slate-100 uppercase tracking-wide">Family Leaderboard</h2>
                  <div className="bg-slate-800/90 p-4 rounded-2xl border border-slate-700 space-y-4">
                    {FAMILY_MEMBERS.map(m => {
                      const count = Object.values(rideState).filter(r => r.includes(m.id)).length;
                      const pct = Math.round((count / RIDES_CATALOG.length) * 100);
                      return (
                        <div key={m.id} className="space-y-1.5">
                          <div className="flex items-center justify-between text-xs">
                            <div className="flex items-center space-x-2">
                              <img src={m.avatarImg} alt={m.name} className="w-6 h-6 rounded-full object-cover border border-amber-300" onError={(e) => { e.target.src = 'https://placehold.co/100x100/1e293b/f59e0b?text=' + m.name; }} />
                              <span className="font-bold text-slate-200">{m.name}</span>
                            </div>
                            <span className="font-bold text-amber-300">{count} / {RIDES_CATALOG.length} rides ({pct}%)</span>
                          </div>
                          <div className="w-full bg-slate-900 h-2.5 rounded-full overflow-hidden p-0.5 border border-slate-800">

                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

                    ❮
                  </button>
                  <button className="absolute top-4 right-4 w-9 h-9 bg-white/90 rounded-full flex items-center justify-center shadow text-pink-600 font-bold active:scale-95">
                    ♥
                  </button>
                </div>

                {/* Card Detail Content */}
                <div className="flex-1 p-5 -mt-6 bg-[#faf6ed] rounded-t-3xl flex flex-col justify-between">
                  <div className="space-y-4">
                    <div>
                      <h2 className="text-2xl font-bold text-[#1b2240] leading-tight font-serif">{selectedRide.name}</h2>
                      <span className="inline-flex items-center space-x-1 mt-2.5 px-3 py-1 bg-[#f4e6d4] text-[#8c5e31] rounded-full text-xs font-semibold">
                        <span>🏰</span>
                        <span>{selectedRide.land}</span>
                      </span>
                    </div>

                    <p className="text-xs text-slate-600 leading-relaxed font-medium">
                      {selectedRide.description}
                    </p>

                    <div className="space-y-3.5 pt-2 text-xs">
                      {/* Thrill Level */}
                      <div className="flex items-center space-x-3.5">
                        <div className="w-6 text-center text-[#1b2240] text-lg font-bold">🎢</div>
                        <div>
                          <div className="font-semibold text-slate-500 text-[10px]">Thrill Level</div>
                          <div className="flex space-x-1 mt-0.5">
                            {[1, 2, 3, 4, 5].map((star) => (
                              <span key={star} className={star <= selectedRide.thrillLevel ? "text-[#1b2240] text-sm" : "text-slate-300 text-sm"}>
                                🐭
                              </span>
                            ))}
                          </div>
                        </div>
                      </div>

                      {/* Height Requirement */}
                      <div className="flex items-center space-x-3.5">
                        <div className="w-6 text-center text-[#1b2240] text-lg font-bold">🧍</div>
                        <div>
                          <div className="font-semibold text-slate-500 text-[10px]">Height Requirement</div>
                          <div className="font-bold text-[#1b2240] text-xs">{selectedRide.heightRequirement}</div>
                        </div>
                      </div>

                      {/* Ride Type */}
                      <div className="flex items-center space-x-3.5">
                        <div className="w-6 text-center text-[#1b2240] text-lg font-bold">🎟️</div>
                        <div>
                          <div className="font-semibold text-slate-500 text-[10px]">Ride Type</div>
                          <div className="font-bold text-[#1b2240] text-xs">{selectedRide.rideType}</div>
                        </div>
                      </div>

                      {/* Duration */}
                      <div className="flex items-center space-x-3.5">
                        <div className="w-6 text-center text-[#1b2240] text-lg font-bold">⏱️</div>
                        <div>
                          <div className="font-semibold text-slate-500 text-[10px]">Duration</div>
                          <div className="font-bold text-[#1b2240] text-xs">{selectedRide.duration}</div>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Mark as Ridden Button */}
                  <div className="pt-6 pb-2">
                    <button 
                      onClick={() => {
                        togglePerson(selectedRide.id, activeMember);
                      }}
                      className={`w-full py-3.5 rounded-full font-bold flex items-center justify-center space-x-2 shadow-md transition-all ${
                        (rideState[selectedRide.id] || []).includes(activeMember)
                          ? 'bg-emerald-500 text-white'
                          : 'bg-[#ffc844] hover:bg-[#f5bc33] text-slate-950'
                      }`}
                    >
                      <span>✓</span>
                      <span>
                        {(rideState[selectedRide.id] || []).includes(activeMember) 
                          ? `Marked as Ridden for ${FAMILY_MEMBERS.find(m=>m.id===activeMember)?.name}`
                          : `Mark as Ridden for ${FAMILY_MEMBERS.find(m=>m.id===activeMember)?.name}`
                        }
                      </span>
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Bottom Navigation */}
            <nav className="h-14 bg-slate-950 border-t border-slate-800 flex justify-around items-center shrink-0">
              <button onClick={() => setActiveTab('home')} className={`text-xs font-bold ${activeTab === 'home' ? 'text-amber-400' : 'text-slate-400'}`}>
                🏰 Rides
              </button>
              <button onClick={() => setActiveTab('stats')} className={`text-xs font-bold ${activeTab === 'stats' ? 'text-amber-400' : 'text-slate-400'}`}>
                📊 Leaderboard
              </button>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
