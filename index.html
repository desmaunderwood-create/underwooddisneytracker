<!DOCTYPE html>
<html lang="en" class="h-full bg-[#FAF9F5]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WDW Family Tracker</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            forest: {
              DEFAULT: '#1B3B2B',
              50: '#F2F7F4',
              100: '#E1ECE5',
              600: '#26523C',
              700: '#1B3B2B',
            },
            sage: {
              DEFAULT: '#8FA89B',
              light: '#EAF0EC',
              dark: '#5E7A6C'
            },
            gold: {
              DEFAULT: '#D4AF37',
              light: '#F8F4E6',
              dark: '#AA8828'
            },
            ivory: '#FAF9F5'
          }
        }
      }
    }
  </script>

  <!-- PWA & Mobile Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="WDW Tracker">
  <meta name="theme-color" content="#1B3B2B">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase Core & Firestore SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    -webkit-tap-highlight-color: transparent;
    body {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #FAF9F5; }
    ::-webkit-scrollbar-thumb { background: #C2D1C8; border-radius: 9999px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Custom Checkbox Animations */
    .member-checkbox:checked + label {
      background-color: #1B3B2B;
      color: #FAF9F5;
      border-color: #1B3B2B;
      box-shadow: 0 3px 8px rgba(27, 59, 43, 0.25);
    }
    .member-checkbox:checked + label .check-badge {
      background-color: #D4AF37;
      color: #1B3B2B;
      opacity: 1;
    }

    .glass-header {
      background: rgba(250, 249, 245, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="h-full flex flex-col text-slate-800 bg-[#FAF9F5] antialiased selection:bg-sage-light">

  <!-- Top Header with Graphic Castle Badge -->
  <header class="glass-header sticky top-0 z-30 border-b border-sage-light/80 px-4 pt-4 pb-3 sm:px-6">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <!-- Graphic Castle Avatar -->
        <div class="w-10 h-10 rounded-2xl bg-forest text-gold flex items-center justify-center shadow-md border border-gold/40 shrink-0">
          <svg class="w-6 h-6 fill-gold" viewBox="0 0 24 24">
            <path d="M12 2L9 7h6l-3-5zm-5 6l-2 4h14l-2-4H7zm-3 5v9h16v-9H4zm7 7h-2v-4h2v4zm4 0h-2v-4h2v4z"/>
          </svg>
        </div>
        <div>
          <h1 class="text-lg sm:text-xl font-extrabold tracking-tight text-forest leading-tight flex items-center gap-1.5">
            WDW Family Tracker <i class="fa-solid fa-crown text-gold text-xs"></i>
          </h1>
          <p class="text-xs text-slate-500 font-medium">Underwood Disney Adventure</p>
        </div>
      </div>
      
      <div class="flex items-center space-x-2">
        <button onclick="openSettingsModal()" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-sage-light text-slate-600 hover:text-forest transition flex items-center justify-center" title="Settings">
          <i class="fa-solid fa-gear text-sm"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Scrollable Content -->
  <main class="flex-1 overflow-y-auto pb-28">
    <div class="max-w-4xl mx-auto px-4 py-5 space-y-6">

      <!-- Overall Family Progress Dashboard -->
      <section class="bg-white rounded-3xl p-5 border border-sage-light/90 shadow-sm relative overflow-hidden">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
          <div>
            <span class="text-xs font-extrabold uppercase tracking-wider text-sage-dark">Magical Progress</span>
            <div class="flex items-baseline space-x-2">
              <span id="total-completed-count" class="text-3xl font-extrabold text-forest">0</span>
              <span class="text-slate-400 font-medium">/ <span id="total-attractions-count">0</span> Experiences</span>
            </div>
          </div>
          
          <div class="inline-flex items-center space-x-2 px-3.5 py-2 bg-gold-light border border-gold/40 rounded-2xl shadow-sm">
            <i class="fa-solid fa-trophy text-gold-dark text-base"></i>
            <div>
              <div class="text-[10px] font-bold tracking-wider text-gold-dark uppercase">All 4 Completed</div>
              <div id="all-four-count" class="text-base font-extrabold text-slate-800 leading-none">0 Ridden</div>
            </div>
          </div>
        </div>

        <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden mb-5">
          <div id="overall-progress-bar" class="bg-forest h-full rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>

        <!-- Family Character Graphic Badges Grid -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <!-- Greg (Mickey Mouse) -->
          <div class="bg-[#FAF9F5] p-3 rounded-2xl border border-slate-200/80 flex items-center gap-2.5">
            <img src="https://img.icons8.com/color/96/mickey-mouse.png" alt="Greg" class="w-9 h-9 rounded-full bg-red-100 p-0.5 shrink-0 border border-red-200">
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-center text-xs mb-1">
                <span class="font-bold text-slate-700 truncate">Greg</span>
                <span id="stat-greg-count" class="font-extrabold text-forest ml-1">0</span>
              </div>
              <div class="w-full bg-slate-200/80 rounded-full h-1.5 overflow-hidden">
                <div id="bar-greg" class="bg-red-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
              </div>
            </div>
          </div>

          <!-- Dez (Belle) -->
          <div class="bg-[#FAF9F5] p-3 rounded-2xl border border-slate-200/80 flex items-center gap-2.5">
            <img src="https://img.icons8.com/color/96/beauty-and-the-beast.png" alt="Dez" class="w-9 h-9 rounded-full bg-amber-100 p-0.5 shrink-0 border border-amber-200">
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-center text-xs mb-1">
                <span class="font-bold text-slate-700 truncate">Dez</span>
                <span id="stat-dez-count" class="font-extrabold text-forest ml-1">0</span>
              </div>
              <div class="w-full bg-slate-200/80 rounded-full h-1.5 overflow-hidden">
                <div id="bar-dez" class="bg-amber-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
              </div>
            </div>
          </div>

          <!-- Emma (Donald Duck) -->
          <div class="bg-[#FAF9F5] p-3 rounded-2xl border border-slate-200/80 flex items-center gap-2.5">
            <img src="https://img.icons8.com/color/96/donald-duck.png" alt="Emma" class="w-9 h-9 rounded-full bg-blue-100 p-0.5 shrink-0 border border-blue-200">
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-center text-xs mb-1">
                <span class="font-bold text-slate-700 truncate">Emma</span>
                <span id="stat-emma-count" class="font-extrabold text-forest ml-1">0</span>
              </div>
              <div class="w-full bg-slate-200/80 rounded-full h-1.5 overflow-hidden">
                <div id="bar-emma" class="bg-blue-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
              </div>
            </div>
          </div>

          <!-- Harper (Daisy Duck) -->
          <div class="bg-[#FAF9F5] p-3 rounded-2xl border border-slate-200/80 flex items-center gap-2.5">
            <img src="https://img.icons8.com/color/96/daisy-duck.png" alt="Harper" class="w-9 h-9 rounded-full bg-purple-100 p-0.5 shrink-0 border border-purple-200">
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-center text-xs mb-1">
                <span class="font-bold text-slate-700 truncate">Harper</span>
                <span id="stat-harper-count" class="font-extrabold text-forest ml-1">0</span>
              </div>
              <div class="w-full bg-slate-200/80 rounded-full h-1.5 overflow-hidden">
                <div id="bar-harper" class="bg-purple-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Navigation Park Tabs -->
      <nav class="flex space-x-2 overflow-x-auto pb-1 no-scrollbar -mx-4 px-4 sm:mx-0 sm:px-0">
        <button onclick="setActivePark('all')" id="tab-all" class="park-tab shrink-0 px-4 py-2.5 rounded-2xl font-bold text-xs sm:text-sm transition flex items-center space-x-2 border bg-forest text-white border-forest shadow-sm">
          <i class="fa-solid fa-layer-group"></i>
          <span>All Parks</span>
        </button>
        <button onclick="setActivePark('mk')" id="tab-mk" class="park-tab shrink-0 px-4 py-2.5 rounded-2xl font-bold text-xs sm:text-sm transition flex items-center space-x-2 border bg-white text-slate-600 border-slate-200 hover:border-sage">
          <i class="fa-solid fa-castle text-amber-600"></i>
          <span>Magic Kingdom</span>
        </button>
        <button onclick="setActivePark('ep')" id="tab-ep" class="park-tab shrink-0 px-4 py-2.5 rounded-2xl font-bold text-xs sm:text-sm transition flex items-center space-x-2 border bg-white text-slate-600 border-slate-200 hover:border-sage">
          <i class="fa-solid fa-globe text-blue-600"></i>
          <span>EPCOT</span>
        </button>
        <button onclick="setActivePark('hs')" id="tab-hs" class="park-tab shrink-0 px-4 py-2.5 rounded-2xl font-bold text-xs sm:text-sm transition flex items-center space-x-2 border bg-white text-slate-600 border-slate-200 hover:border-sage">
          <i class="fa-solid fa-film text-red-600"></i>
          <span>Hollywood Studios</span>
        </button>
        <button onclick="setActivePark('ak')" id="tab-ak" class="park-tab shrink-0 px-4 py-2.5 rounded-2xl font-bold text-xs sm:text-sm transition flex items-center space-x-2 border bg-white text-slate-600 border-slate-200 hover:border-sage">
          <i class="fa-solid fa-tree text-emerald-600"></i>
          <span>Animal Kingdom</span>
        </button>
      </nav>

      <!-- Search & Filters -->
      <section class="bg-white p-3.5 rounded-2xl border border-sage-light/80 shadow-sm space-y-3">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input 
            type="text" 
            id="search-input" 
            placeholder="Search attractions or lands..." 
            oninput="handleFilterChange()"
            class="w-full pl-10 pr-4 py-2.5 bg-[#FAF9F5] border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-forest/20 focus:border-forest transition"
          >
          <button id="clear-search" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1">
            <i class="fa-solid fa-xmark text-sm"></i>
          </button>
        </div>

        <div class="flex items-center space-x-2 overflow-x-auto no-scrollbar pt-1">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider shrink-0 mr-1"><i class="fa-solid fa-filter text-[10px]"></i> Filter:</span>
          
          <button onclick="setFilter('all')" id="filter-all" class="filter-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-semibold bg-forest text-white">All</button>
          <button onclick="setFilter('unridden')" id="filter-unridden" class="filter-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200">Unridden</button>
          <button onclick="setFilter('all4')" id="filter-all4" class="filter-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200">Completed by All 4</button>
          <button onclick="setFilter('not-greg')" id="filter-not-greg" class="filter-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200">Needs: Greg</button>
          <button onclick="setFilter('not-dez')" id="filter-not-dez" class="filter-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200">Needs: Dez</button>
          <button onclick="setFilter('not-emma')" id="filter-not-emma" class="filter-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200">Needs: Emma</button>
          <button onclick="setFilter('not-harper')" id="filter-not-harper" class="filter-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200">Needs: Harper</button>
        </div>
      </section>

      <!-- Summary Header -->
      <div class="flex items-center justify-between px-1">
        <div id="park-summary-title" class="text-sm font-extrabold text-forest uppercase tracking-wide">
          All Parks
        </div>
        <div id="results-count" class="text-xs font-medium text-slate-500">
          Showing 0 attractions
        </div>
      </div>

      <!-- Attraction Cards Container -->
      <div id="attractions-container" class="space-y-6">
        <!-- Dynamic JS Rendering -->
      </div>

    </div>
  </main>

  <!-- Settings Modal -->
  <div id="settings-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-sage-light space-y-5 animate-in fade-in zoom-in duration-200">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 class="text-lg font-bold text-forest flex items-center gap-2">
          <i class="fa-solid fa-sliders text-sage-dark"></i> Options & Data
        </h3>
        <button onclick="closeSettingsModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-500">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <div class="space-y-2">
        <label class="text-xs font-bold uppercase tracking-wider text-slate-400">Reset Progress</label>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="confirmResetCurrentPark()" class="px-3 py-2 bg-slate-50 hover:bg-red-50 text-slate-700 hover:text-red-600 border border-slate-200 rounded-xl text-xs font-semibold text-left transition flex items-center justify-between">
            <span>Reset Active Park</span>
            <i class="fa-solid fa-arrow-rotate-left text-[10px]"></i>
          </button>
          <button onclick="confirmResetAll()" class="px-3 py-2 bg-slate-50 hover:bg-red-50 text-slate-700 hover:text-red-600 border border-slate-200 rounded-xl text-xs font-semibold text-left transition flex items-center justify-between">
            <span>Reset All Data</span>
            <i class="fa-solid fa-trash text-[10px]"></i>
          </button>
        </div>
      </div>

      <div class="space-y-2 border-t border-slate-100 pt-3">
        <label class="text-xs font-bold uppercase tracking-wider text-slate-400">Backup & Manual Sync</label>
        <div class="flex gap-2">
          <button onclick="exportData()" class="flex-1 px-4 py-2.5 bg-sage-light/60 hover:bg-sage-light text-forest border border-sage/30 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-2">
            <i class="fa-solid fa-download"></i>
            <span>Export Backup</span>
          </button>
          <label class="flex-1 px-4 py-2.5 bg-sage-light/60 hover:bg-sage-light text-forest border border-sage/30 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-2 cursor-pointer">
            <i class="fa-solid fa-upload"></i>
            <span>Import Backup</span>
            <input type="file" id="import-file" accept=".json" onchange="importData(event)" class="hidden">
          </label>
        </div>
      </div>

      <button onclick="closeSettingsModal()" class="w-full py-2.5 bg-forest text-white rounded-xl font-semibold text-sm shadow-md hover:bg-forest-600 transition">
        Done
      </button>
    </div>
  </div>

  <!-- Custom Confirmation Modal -->
  <div id="confirm-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-xs w-full p-5 shadow-2xl border border-slate-100 text-center space-y-4">
      <div class="w-12 h-12 rounded-full bg-red-100 text-red-600 mx-auto flex items-center justify-center text-xl">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <div>
        <h4 id="confirm-title" class="font-bold text-slate-800 text-base">Are you sure?</h4>
        <p id="confirm-msg" class="text-xs text-slate-500 mt-1">This action cannot be undone.</p>
      </div>
      <div class="grid grid-cols-2 gap-2 pt-2">
        <button onclick="closeConfirmModal(false)" class="py-2 bg-slate-100 text-slate-700 rounded-xl font-semibold text-xs hover:bg-slate-200 transition">Cancel</button>
        <button id="confirm-btn-yes" onclick="closeConfirmModal(true)" class="py-2 bg-red-600 text-white rounded-xl font-semibold text-xs hover:bg-red-700 transition shadow-sm">Reset</button>
      </div>
    </div>
  </div>

          { name: 'Hollywood Boulevard & Echo Lake', attractions: [{ id: 'hs-1', name: 'Indiana Jones Epic Stunt Spectacular!' }, { id: 'hs-2', name: 'For the First Time in Forever: A Frozen Sing-Along' }, { id: 'hs-3', name: 'Star Tours - The Adventures Continue' }] },
          { name: 'Grand Avenue', attractions: [{ id: 'hs-4', name: 'Muppet*Vision 3D' }] },
          { name: "Star Wars: Galaxy's Edge", attractions: [{ id: 'hs-5', name: 'Star Wars: Rise of the Resistance' }, { id: 'hs-6', name: 'Millennium Falcon: Smugglers Run' }] },
          { name: 'Toy Story Land', attractions: [{ id: 'hs-7', name: 'Slinky Dog Dash' }, { id: 'hs-8', name: 'Toy Story Mania!' }, { id: 'hs-9', name: 'Alien Swirling Saucers' }] },
          { name: 'Pixar Plaza & Animation Courtyard', attractions: [{ id: 'hs-10', name: 'Walt Disney Presents' }, { id: 'hs-11', name: 'Disney Junior Play and Dance!' }] },
          { name: 'Sunset Boulevard', attractions: [{ id: 'hs-12', name: 'The Twilight Zone Tower of Terror' }, { id: 'hs-13', name: "Rock 'n' Roller Coaster Starring Aerosmith" }, { id: 'hs-14', name: 'Beauty and the Beast - Live on Stage' }, { id: 'hs-15', name: 'Fantasmic!' }] }
        ]
      },
      {
        id: 'ak',
        name: "Disney's Animal Kingdom",
        icon: 'fa-tree',
        color: 'text-emerald-600',
        lands: [
          { name: 'Oasis & Discovery Island', attractions: [{ id: 'ak-1', name: "It's Tough to be a Bug! (Tree of Life)" }] },
          { name: 'Pandora - The World of Avatar', attractions: [{ id: 'ak-2', name: 'Avatar Flight of Passage' }, { id: 'ak-3', name: "Na'vi River Journey" }] },
          { name: 'Africa', attractions: [{ id: 'ak-4', name: 'Kilimanjaro Safaris' }, { id: 'ak-5', name: 'Festival of the Lion King' }, { id: 'ak-6', name: 'Gorilla Falls Exploration Trail' }] },
          { name: 'Asia', attractions: [{ id: 'ak-7', name: 'Expedition Everest - Legend of the Forbidden Mountain' }, { id: 'ak-8', name: 'Kali River Rapids' }, { id: 'ak-9', name: 'Feathered Friends in Flight!' }] },
          { name: 'DinoLand U.S.A.', attractions: [{ id: 'ak-10', name: 'DINOSAUR' }, { id: 'ak-11', name: 'TriceraTop Spin' }, { id: 'ak-12', name: 'Finding Nemo: The Big Blue... and Beyond!' }] }
        ]
      }
    ];

    const FAMILY_MEMBERS = ['greg', 'dez', 'emma', 'harper'];
    const CHARACTER_IMAGES = {
      greg: 'https://img.icons8.com/color/96/mickey-mouse.png',
      dez: 'https://img.icons8.com/color/96/beauty-and-the-beast.png',
      emma: 'https://img.icons8.com/color/96/donald-duck.png',
      harper: 'https://img.icons8.com/color/96/daisy-duck.png'
    };
    const STORAGE_KEY = 'wdw_family_tracker_data_v2';

    let appState = {
      userProgress: {},
      activePark: 'all',
      activeFilter: 'all',
      searchQuery: ''
    };

    let confirmCallback = null;

    // --- INITIALIZATION ---
    window.addEventListener('DOMContentLoaded', () => {
      loadLocalFallback();
      setupFirestoreSync();
      renderApp();
    });

    function setupFirestoreSync() {
      docRef.onSnapshot((doc) => {
        if (doc.exists) {
          appState.userProgress = doc.data().attractions || {};
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appState.userProgress));
          updateDashboardStats();
          renderApp();
        } else {
          docRef.set({ attractions: appState.userProgress || {} });
        }
      });
    }

    function loadLocalFallback() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) appState.userProgress = JSON.parse(saved);
      } catch (e) {
        console.error('Local load error:', e);
      }
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState.userProgress));
        updateDashboardStats();
        docRef.set({ attractions: appState.userProgress }, { merge: true });
      } catch (e) {
        console.error('Save error:', e);
      }
    }

    function toggleMember(attractionId, member) {
      if (!appState.userProgress[attractionId]) {
        appState.userProgress[attractionId] = { greg: false, dez: false, emma: false, harper: false };
      }
      appState.userProgress[attractionId][member] = !appState.userProgress[attractionId][member];
      saveData();
      renderApp();
    }

    function toggleAllForAttraction(attractionId) {
      const current = appState.userProgress[attractionId] || {};
      const allChecked = FAMILY_MEMBERS.every(m => current[m]);

      appState.userProgress[attractionId] = {
        greg: !allChecked,
        dez: !allChecked,
        emma: !allChecked,
        harper: !allChecked
      };

      saveData();
      renderApp();
    }

    function updateDashboardStats() {
      let totalAttractions = 0;
      let totalCompletedAtLeastOne = 0;
      let allFourCompleted = 0;
      const memberCounts = { greg: 0, dez: 0, emma: 0, harper: 0 };

      PARKS_DATA.forEach(park => {
        park.lands.forEach(land => {
          land.attractions.forEach(attr => {
            totalAttractions++;
            const status = appState.userProgress[attr.id] || {};
            let riddenByAny = false;
            let riddenByAll = true;

            FAMILY_MEMBERS.forEach(member => {
              if (status[member]) {
                memberCounts[member]++;
                riddenByAny = true;
              } else {
                riddenByAll = false;
              }
            });

            if (riddenByAny) totalCompletedAtLeastOne++;
            if (riddenByAll) allFourCompleted++;
          });
        });
      });

      const totalAttrEl = document.getElementById('total-attractions-count');
      const totalCompEl = document.getElementById('total-completed-count');
      const allFourEl = document.getElementById('all-four-count');
      const progressBarEl = document.getElementById('overall-progress-bar');

      if (totalAttrEl) totalAttrEl.textContent = totalAttractions;
      if (totalCompEl) totalCompEl.textContent = totalCompletedAtLeastOne;
      if (allFourEl) allFourEl.textContent = `${allFourCompleted} / ${totalAttractions}`;

      const pctOverall = totalAttractions > 0 ? (totalCompletedAtLeastOne / totalAttractions) * 100 : 0;
      if (progressBarEl) progressBarEl.style.width = `${pctOverall}%`;

      FAMILY_MEMBERS.forEach(m => {
        const count = memberCounts[m];
        const countEl = document.getElementById(`stat-${m}-count`);
        const barEl = document.getElementById(`bar-${m}`);
        if (countEl) countEl.textContent = `${count}/${totalAttractions}`;
        const pct = totalAttractions > 0 ? (count / totalAttractions) * 100 : 0;
        if (barEl) barEl.style.width = `${pct}%`;
      });
    }

    function setActivePark(parkId) {
      appState.activePark = parkId;
      document.querySelectorAll('.park-tab').forEach(btn => {
        btn.classList.remove('bg-forest', 'text-white', 'border-forest', 'shadow-sm');
        btn.classList.add('bg-white', 'text-slate-600', 'border-slate-200');
      });
      const activeBtn = document.getElementById(`tab-${parkId}`);
      if (activeBtn) {
        activeBtn.classList.remove('bg-white', 'text-slate-600', 'border-slate-200');
        activeBtn.classList.add('bg-forest', 'text-white', 'border-forest', 'shadow-sm');
      }
      renderApp();
    }

    function setFilter(filterType) {
      appState.activeFilter = filterType;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-forest', 'text-white');
        btn.classList.add('bg-slate-100', 'text-slate-600');
      });
      const activeBtn = document.getElementById(`filter-${filterType}`);
      if (activeBtn) {
        activeBtn.classList.remove('bg-slate-100', 'text-slate-600');
        activeBtn.classList.add('bg-forest', 'text-white');
      }
      renderApp();
    }

    function handleFilterChange() {
      const val = document.getElementById('search-input').value.trim();
      appState.searchQuery = val.toLowerCase();
      const clearBtn = document.getElementById('clear-search');
      if (clearBtn) {
        if (val.length > 0) clearBtn.classList.remove('hidden');
        else clearBtn.classList.add('hidden');
      }
      renderApp();
    }

    function clearSearch() {
      const input = document.getElementById('search-input');
      if (input) input.value = '';
      appState.searchQuery = '';
      const clearBtn = document.getElementById('clear-search');
      if (clearBtn) clearBtn.classList.add('hidden');
      renderApp();
    }

    function renderApp() {
      updateDashboardStats();
      const container = document.getElementById('attractions-container');
      if (!container) return;
      container.innerHTML = '';

      const selectedParks = appState.activePark === 'all' 
        ? PARKS_DATA 
        : PARKS_DATA.filter(p => p.id === appState.activePark);

      let displayedCount = 0;

      selectedParks.forEach(park => {
        let parkHTML = '';
        let parkVisibleAttractions = 0;

        park.lands.forEach(land => {
          const filteredAttractions = land.attractions.filter(attr => {
            const status = appState.userProgress[attr.id] || {};
            if (appState.searchQuery) {
              const matchName = attr.name.toLowerCase().includes(appState.searchQuery);
              const matchLand = land.name.toLowerCase().includes(appState.searchQuery);
              if (!matchName && !matchLand) return false;
            }

            const riddenCount = FAMILY_MEMBERS.filter(m => status[m]).length;
            if (appState.activeFilter === 'unridden') return riddenCount === 0;
            if (appState.activeFilter === 'all4') return riddenCount === 4;
            if (appState.activeFilter === 'not-greg') return !status.greg;
            if (appState.activeFilter === 'not-dez') return !status.dez;
            if (appState.activeFilter === 'not-emma') return !status.emma;
            if (appState.activeFilter === 'not-harper') return !status.harper;

            return true;
          });

          if (filteredAttractions.length > 0) {
            parkVisibleAttractions += filteredAttractions.length;
            parkHTML += `
              <div class="mb-5">
                <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2.5 flex items-center gap-1.5">
                  <span class="w-1.5 h-1.5 rounded-full bg-forest"></span>
                  ${land.name}
                </h4>
                <div class="space-y-2.5">
                  ${filteredAttractions.map(attr => renderAttractionCard(attr)).join('')}
                </div>
              </div>
            `;
          }
        });

        if (parkVisibleAttractions > 0) {
          displayedCount += parkVisibleAttractions;
          const parkWrapper = document.createElement('div');
          parkWrapper.className = "bg-white rounded-3xl p-4 sm:p-5 border border-sage-light/80 shadow-sm space-y-4";
          parkWrapper.innerHTML = `
            <div class="flex items-center space-x-3 border-b border-slate-100 pb-3">
              <div class="w-10 h-10 rounded-2xl bg-slate-100 flex items-center justify-center">
                <i class="fa-solid ${park.icon} ${park.color} text-lg"></i>
              </div>
              <div>
                <h3 class="font-extrabold text-forest text-base sm:text-lg leading-snug">${park.name}</h3>
                <span class="text-xs text-slate-400 font-medium">${parkVisibleAttractions} attractions</span>
              </div>
            </div>
            ${parkHTML}
          `;
          container.appendChild(parkWrapper);
        }
      });

      const summaryTitleEl = document.getElementById('park-summary-title');
      const resultsCountEl = document.getElementById('results-count');
      if (summaryTitleEl) {
        summaryTitleEl.textContent = appState.activePark === 'all' 
          ? 'All Parks' 
          : PARKS_DATA.find(p => p.id === appState.activePark)?.name || 'Park Detail';
      }
      if (resultsCountEl) resultsCountEl.textContent = `Showing ${displayedCount} attractions`;
    }

    function renderAttractionCard(attr) {
      const status = appState.userProgress[attr.id] || {};
      const allChecked = FAMILY_MEMBERS.every(m => status[m]);

      return `
        <div class="bg-[#FAF9F5] p-3.5 rounded-2xl border border-slate-200/80 hover:border-sage/60 transition space-y-3">
          <div class="flex items-center justify-between gap-2">
            <span class="font-bold text-slate-800 text-sm leading-snug">${attr.name}</span>
            <button onclick="toggleAllForAttraction('${attr.id}')" 
                    class="shrink-0 px-2.5 py-1 rounded-xl text-[11px] font-bold transition border ${
                      allChecked 
                        ? 'bg-gold-light text-gold-dark border-gold/40' 
                        : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-100'
                    }">
              ${allChecked ? '<i class="fa-solid fa-crown text-[10px]"></i> All 4' : 'Check All'}
            </button>
          </div>

          <div class="grid grid-cols-4 gap-1.5 pt-1">
            ${FAMILY_MEMBERS.map(m => {
              const isChecked = status[m] || false;
              const capitalized = m.charAt(0).toUpperCase() + m.slice(1);
              const imgUrl = CHARACTER_IMAGES[m];
              return `
                <div>
                  <input type="checkbox" id="${attr.id}-${m}" class="hidden member-checkbox" ${isChecked ? 'checked' : ''} onchange="toggleMember('${attr.id}', '${m}')">
                  <label for="${attr.id}-${m}" class="flex flex-col items-center justify-center py-2 px-1 rounded-2xl border border-slate-200 bg-white text-slate-700 cursor-pointer transition active:scale-95 text-center relative overflow-hidden">
                    <img src="${imgUrl}" alt="${capitalized}" class="w-6 h-6 mb-1 rounded-full object-contain">
                    <span class="text-[11px] font-bold leading-none">${capitalized}</span>
                    <div class="check-badge absolute top-1 right-1 w-3.5 h-3.5 rounded-full bg-forest text-white text-[8px] flex items-center justify-center font-bold opacity-0 transition-all">
                      ✓
                    </div>
                  </label>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function openSettingsModal() {
      const modal = document.getElementById('settings-modal');
      if (modal) modal.classList.remove('hidden');
    }

    function closeSettingsModal() {
      const modal = document.getElementById('settings-modal');
      if (modal) modal.classList.add('hidden');
    }

    function confirmResetCurrentPark() {
      const parkName = appState.activePark === 'all' 
        ? 'All Parks' 
        : PARKS_DATA.find(p => p.id === appState.activePark)?.name;

      showConfirmModal(`Reset ${parkName}?`, `This will uncheck all family members for ${parkName}.`, () => {
        PARKS_DATA.forEach(park => {
          if (appState.activePark === 'all' || park.id === appState.activePark) {
            park.lands.forEach(land => {
              land.attractions.forEach(attr => {
                delete appState.userProgress[attr.id];
              });
            });
          }
        });
        saveData();
        renderApp();
      });
    }

    function confirmResetAll() {
      showConfirmModal('Reset All Data?', 'This will clear all checkbox data across all 4 parks.', () => {
        appState.userProgress = {};
        saveData();
        renderApp();
      });
    }

    function showConfirmModal(title, msg, onConfirm) {
      const titleEl = document.getElementById('confirm-title');
      const msgEl = document.getElementById('confirm-msg');
      const modal = document.getElementById('confirm-modal');
      if (titleEl) titleEl.textContent = title;
      if (msgEl) msgEl.textContent = msg;
      confirmCallback = onConfirm;
      if (modal) modal.classList.remove('hidden');
    }

    function closeConfirmModal(confirmed) {
      const modal = document.getElementById('confirm-modal');
      if (modal) modal.classList.add('hidden');
      if (confirmed && confirmCallback) confirmCallback();
      confirmCallback = null;
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState.userProgress, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `wdw_family_tracker_backup.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (typeof imported === 'object') {
            appState.userProgress = imported;
            saveData();
            renderApp();
            closeSettingsModal();
          }
        } catch (err) {
          alert('Invalid backup file.');
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
