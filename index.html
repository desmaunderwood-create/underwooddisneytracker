      {

          { name: "Star Wars: Galaxy's Edge", attractions: [{ id: 'hs-5', name: 'Star Wars: Rise of the Resistance' }, { id: 'hs-6', name: 'Millennium Falcon: Smugglers Run' }] },
          { name: 'Toy Story Land', attractions: [{ id: 'hs-7', name: 'Slinky Dog Dash' }, { id: 'hs-8', name: 'Toy Story Mania!' }, { id: 'hs-9', name: 'Alien Swirling Saucers' }] },
          { name: 'Pixar Plaza & Animation Courtyard', attractions: [{ id: 'hs-10', name: 'Walt Disney Presents' }, { id: 'hs-11', name: 'Disney Junior Play and Dance!' }] },
          { name: 'Sunset Boulevard', attractions: [{ id: 'hs-12', name: 'The Twilight Zone Tower of Terror' }, { id: 'hs-13', name: "Rock 'n' Roller Coaster Starring Aerosmith" }, { id: 'hs-14', name: 'Beauty and the Beast - Live on Stage' }, { id: 'hs-15', name: 'Fantasmic!' }] }
        ]
      },
      {
        id: 'ak', name: "Disney's Animal Kingdom", icon: 'fa-tree', color: 'text-emerald-400',
        lands: [
          { name: 'Oasis & Discovery Island', attractions: [{ id: 'ak-1', name: "It's Tough to be a Bug! (Tree of Life)" }] },
          { name: 'Pandora - The World of Avatar', attractions: [{ id: 'ak-2', name: 'Avatar Flight of Passage' }, { id: 'ak-3', name: "Na'vi River Journey" }] },
          { name: 'Africa', attractions: [{ id: 'ak-4', name: 'Kilimanjaro Safaris' }, { id: 'ak-5', name: 'Festival of the Lion King' }, { id: 'ak-6', name: 'Gorilla Falls Exploration Trail' }] },
          { name: 'Asia', attractions: [{ id: 'ak-7', name: 'Expedition Everest - Legend of the Forbidden Mountain' }, { id: 'ak-8', name: 'Kali River Rapids' }, { id: 'ak-9', name: 'Feathered Friends in Flight!' }] },
          { name: 'DinoLand U.S.A.', attractions: [{ id: 'ak-10', name: 'DINOSAUR' }, { id: 'ak-11', name: 'TriceraTop Spin' }, { id: 'ak-12', name: 'Finding Nemo: The Big Blue... and Beyond!' }] }
        ]
      }
    ];

    const FAMILY_MEMBERS = ['greg', 'dez', 'emma', 'harper'];
    const CHARACTER_META = {
      greg: { name: 'Greg', sub: 'Mickey' },
      dez: { name: 'Dez', sub: 'Belle' },
      emma: { name: 'Emma', sub: 'Donald' },
      harper: { name: 'Harper', sub: 'Daisy' }
    };
    const STORAGE_KEY = 'wdw_carousel_chronicles_v3';

    let appState = { userProgress: {}, activePark: 'all', searchQuery: '' };

    window.addEventListener('DOMContentLoaded', () => {
      loadLocalFallback();
      setupFirestoreSync();
      renderApp();
    });

    function setupFirestoreSync() {
      docRef.onSnapshot((doc) => {
        if (doc.exists) {
          appState.userProgress = doc.data().attractions || {};
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appState.userProgress));
          updateStats();
          renderApp();
        } else {
          docRef.set({ attractions: {} });
        }
      });
    }

    function loadLocalFallback() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) appState.userProgress = JSON.parse(saved);
      } catch (e) {}
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appState.userProgress));
      updateStats();
      docRef.set({ attractions: appState.userProgress }, { merge: true });
    }

    function toggleMember(attractionId, member) {
      if (!appState.userProgress[attractionId]) {
        appState.userProgress[attractionId] = { greg: false, dez: false, emma: false, harper: false };
      }
      appState.userProgress[attractionId][member] = !appState.userProgress[attractionId][member];
      saveData();
      renderApp();
    }

    function toggleAllForAttraction(attractionId) {
      const current = appState.userProgress[attractionId] || {};
      const allChecked = FAMILY_MEMBERS.every(m => current[m]);
      appState.userProgress[attractionId] = { greg: !allChecked, dez: !allChecked, emma: !allChecked, harper: !allChecked };
      saveData();
      renderApp();
    }

    function updateStats() {
      let total = 0, completed = 0;
      PARKS_DATA.forEach(p => p.lands.forEach(l => l.attractions.forEach(a => {
        total++;
        const s = appState.userProgress[a.id] || {};
        if (FAMILY_MEMBERS.some(m => s[m])) completed++;
      })));
      document.getElementById('stat-rides-today').textContent = completed;
      document.getElementById('stat-still-to-go').textContent = Math.max(0, total - completed);
    }

    function setActivePark(parkId) {
      appState.activePark = parkId;
      document.querySelectorAll('.park-tab').forEach(btn => {
        btn.className = "park-tab shrink-0 px-4 py-2 rounded-2xl font-black text-xs transition flex items-center space-x-1.5 bg-slate-800 text-slate-300 border border-slate-700";
      });
      const activeBtn = document.getElementById(`tab-${parkId}`);
      if (activeBtn) activeBtn.className = "park-tab shrink-0 px-4 py-2 rounded-2xl font-black text-xs transition flex items-center space-x-1.5 bg-blue-600 text-white shadow-md";
      renderApp();
    }

    function handleFilterChange() {
      appState.searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
      renderApp();
    }

    function renderApp() {
      updateStats();
      const container = document.getElementById('attractions-container');
      if (!container) return;
      container.innerHTML = '';

      const parks = appState.activePark === 'all' ? PARKS_DATA : PARKS_DATA.filter(p => p.id === appState.activePark);

      parks.forEach(park => {
        let parkHTML = '';
        park.lands.forEach(land => {
          const attrs = land.attractions.filter(a => {
            if (!appState.searchQuery) return true;
            return a.name.toLowerCase().includes(appState.searchQuery) || land.name.toLowerCase().includes(appState.searchQuery);
          });

          if (attrs.length > 0) {
            parkHTML += `
              <div class="mb-4">
                <h4 class="text-[11px] font-black text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                  <span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span> ${land.name}
                </h4>
                <div class="space-y-2.5">
                  ${attrs.map(attr => renderCard(attr)).join('')}
                </div>
              </div>
            `;
          }
        });

        if (parkHTML) {
          const wrap = document.createElement('div');
          wrap.className = "bg-slate-800/80 rounded-3xl p-4 border border-slate-700/80 shadow-xl space-y-3";
          wrap.innerHTML = `
            <div class="flex items-center space-x-3 border-b border-slate-700/60 pb-3">
              <div class="w-9 h-9 rounded-xl bg-slate-900 flex items-center justify-center">
                <i class="fa-solid ${park.icon} ${park.color} text-base"></i>
              </div>
              <h3 class="font-black text-white text-sm">${park.name}</h3>
            </div>
            ${parkHTML}
          `;
          container.appendChild(wrap);
        }
      });
    }

    function renderCard(attr) {
      const status = appState.userProgress[attr.id] || {};
      const allChecked = FAMILY_MEMBERS.every(m => status[m]);

      return `
        <div class="bg-slate-900/90 p-3 rounded-2xl border border-slate-700/60 hover:border-slate-600 transition space-y-2.5">
          <div class="flex items-center justify-between gap-2">
            <span class="font-bold text-white text-xs leading-snug">${attr.name}</span>
            <button onclick="toggleAllForAttraction('${attr.id}')" class="shrink-0 px-2.5 py-1 rounded-xl text-[10px] font-black transition border ${allChecked ? 'bg-amber-500/20 text-amber-300 border-amber-500/40' : 'bg-slate-800 text-slate-400 border-slate-700 hover:text-white'}">
              ${allChecked ? '<i class="fa-solid fa-crown text-[9px]"></i> All 4' : 'Check All'}
            </button>
          </div>
          <div class="grid grid-cols-4 gap-1.5">
            ${FAMILY_MEMBERS.map(m => {
              const isChecked = status[m] || false;
              const meta = CHARACTER_META[m];
              return `
                <div>
                  <input type="checkbox" id="${attr.id}-${m}" class="hidden member-checkbox" ${isChecked ? 'checked' : ''} onchange="toggleMember('${attr.id}', '${m}')">
                  <label for="${attr.id}-${m}" class="flex flex-col items-center justify-center py-2 px-1 rounded-xl border border-slate-800 bg-slate-800/60 text-slate-300 cursor-pointer transition active:scale-95 text-center relative">
                    <span class="text-[11px] font-black leading-none mb-0.5">${meta.name}</span>
                    <span class="text-[9px] text-slate-400 leading-none">${meta.sub}</span>
                    <div class="check-indicator absolute top-1 right-1 w-3 h-3 rounded-full bg-amber-400 text-slate-950 text-[7px] flex items-center justify-center font-black opacity-0 transition-all scale-50">✓</div>
                  </label>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function switchView(view) {
      if (view === 'stats') {
        alert("Stats view active! Your live progress syncs across your devices automatically.");
      } else if (view === 'map') {
        alert("Tip: Use the search bar to find attractions instantly as you walk the parks!");
      }
    }

    function openSettingsModal() { document.getElementById('settings-modal').classList.remove('hidden'); }
    function closeSettingsModal() { document.getElementById('settings-modal').classList.add('hidden'); }
    function confirmResetAll() {
      if (confirm("Are you sure you want to reset all app progress?")) {
        appState.userProgress = {};
        saveData();
        renderApp();
        closeSettingsModal();
      }
    }
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState.userProgress, null, 2));
      const anchor = document.createElement('a');
      anchor.setAttribute("href", dataStr);
      anchor.setAttribute("download", `carousel_chronicles_backup.json`);
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
    }
  </script>
</body>
</html>
